server:
  port: 8086

feign:
  # OkHttp 连接池：避免每次调用都新建 TCP 连接
  okhttp:
    enabled: true
  # 开启后 Feign 的 fallbackFactory 才真正生效（兜底类声明在 llmall-api）
  sentinel:
    enabled: true
  client:
    config:
      default:
        # 【注意】Feign 默认没有读超时：下游 hang 住时调用方会一直等并耗尽线程池/连接池，必须显式配置
        connectTimeout: 2000
        readTimeout: 5000
spring:
  application:
    name: llmall-pay-service
  profiles:
    # 【注意】必须用 local：dev 里的 llmall.db.host 是容器名 mysql，仅 docker 网络内可解析
    # 在 IDEA / 本机 java -jar 下会报 java.net.UnknownHostException: mysql
    active: local
  # 数据源（url / driver / 账号 / hikari 池参数）统一来自 Nacos 的 shared-jdbc.yaml，本文件不再复制一份
  # 库名由下方 llmall.db.database 提供，host/pw 在 application-local.yaml
  cloud:
    sentinel:
      transport:
        # Sentinel 控制台地址（默认按"控制台与应用同机"取）：换环境用启动参数
        # --llmall.sentinel.dashboard=ip:8090、LLMALL_SENTINEL_DASHBOARD 或 Nacos 配置覆盖，均无需改代码
        # 【注意】控制台自身默认端口 8080 会与网关冲突，启动时必须显式指定 8090；
        # 控制台不在线只是连接告警，不影响 @SentinelResource 定义的限流/降级生效
        dashboard: ${llmall.sentinel.dashboard:localhost:8090}
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:192.168.189.128:8848}
  # MQ 连接（shared-mq.yaml）与 Redis 连接（shared-redis.yaml）统一由 Nacos 下发，本文件不再复制一份：
  #   - shared-mq.yaml   ：支付成功事件 pay.success 的交换机/队列与消费口径（prefetch、重试次数）
  #   - shared-redis.yaml：支付并发闸门 pay:lock:{payOrderId} 用的 Redis（host/pw/lettuce 池）
  # 地址由 application-local.yaml 的 llmall.mq.host / llmall.redis.host|pw 提供
# MyBatis-Plus 公共配置来自 Nacos 的 shared-mybatis.yaml。
logging:
  # 日志级别与输出格式来自 Nacos 的 shared-log.yaml；这里只留"按服务名分目录"这一项服务私有配置。
  pattern:
    dateformat: HH:mm:ss:SSS
  file:
    path: "logs/${spring.application.name}"
llmall:
  db:
    # 库名：shared-jdbc.yaml 用 ${llmall.db.database} 拼 url；host/pw 在 application-local.yaml。
    database: llmall-pay
  jwt:
    location: ${LLMALL_JKS_LOCATION:classpath:llmall.jks}
    alias: llmall
    password: ${LLMALL_JKS_PASSWORD:llmall123}
    tokenTTL: 30m
  # 服务间内部调用凭证：由网关（认证后）与 Feign（DefaultFeignConfig）注入，网关会剥离外部自带的同名头
  # 也被 UserInfoInterceptor 用来判断 user-info 是否可信：服务监听 0.0.0.0，能收到 user-info 不代表来自网关
  internal:
    # 【凭证一】"本请求经过网关"的内部凭证，UserInfoInterceptor 据此判断 user-info 是否可信
    # 【注意】默认值仅用于本地演示，生产应由配置中心下发且不对外暴露
    token: ${LLMALL_INTERNAL_TOKEN:llmall-internal-demo-token}
    # 【凭证二】调用交易域"标记订单已支付"接口（TradeClient）必须携带，值必须与 llmall-trade-service 的
    # llmall.internal.service-token 一致；网关对 x-service-token 只剥离、不注入，不配置则调用被 403 拒绝（fail-closed）
    service-token: ${LLMALL_SERVICE_TOKEN:llmall-service-demo-token}

# 接口文档 knife4j 4.x（openapi3 分支，底层 springdoc-openapi）：UI /doc.html，OpenAPI JSON /v3/api-docs
# 注解用 swagger v3（io.swagger.v3.oas.annotations）；springdoc 直接吃 Boot 2.6+ 默认的 PathPatternParser
# 【注意】不要退回 knife4j 2.x/openapi2：底层 springfox 2.10.5 已停更，与 Spring Boot 2.6+ 有启动期 NPE 不兼容
knife4j:
  enable: true
  setting:
    language: zh_cn
springdoc:
  api-docs:
    path: /v3/api-docs
  # 每个服务是一个独立限界上下文，直接扫本应用全部 controller，不必按包名逐个列举
  group-configs:
    - group: default
      paths-to-match: '/**'
      packages-to-scan: com.llmall


# 运行指标暴露（health/info/metrics/prometheus、liveness/readiness 探针、Sentinel 健康指标）统一来自 Nacos 的 shared-log.yaml
# 【注意】/actuator/** 不进网关白名单，仅内网直连