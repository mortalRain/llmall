server:
  port: 8087
feign:
  okhttp:
    enabled: true # 开启 OKHttp 连接池
  sentinel:
    enabled: true # 开启 Feign 对 Sentinel 的支持
spring:
  cloud:
    sentinel:
      # eager=true：启动即向控制台注册。默认是惰性的（false），要等第一次请求进来才注册，
      # 结果就是"服务已经起来了、控制台里却什么都没有"，很容易误判成控制台没连上（实测踩过）。
      # eager=false：**不要再改成 true**。eager=true 会在启动期就去连 Sentinel 控制台，
      # 控制台没起（开发常态）时 SentinelAutoConfiguration 初始化直接 NPE → 整个服务启动失败（实测踩过）。
      # 代价：控制台要等第一次请求进来才看到实例，这比"服务起不来"划算得多。
      eager: false
      transport:
        # 注意：# 之前必须有空格，否则后面整段说明会被当成 dashboard 值的一部分（实测踩过）
        dashboard: ${llmall.sentinel.dashboard:localhost:8090} # Sentinel 控制台（默认本机 8090）
      http-method-specify: true # 以请求方式作为资源名称
llmall:
  swagger:
    title: "同城生活电商综合服务系统 · 门店服务接口文档"
    package: com.llmall.shop.controller
  db:
    database: llmall-shop
  # 运维接口总开关：false 时 /shops/cache/** 与 /shops/{id}/hot/recompute 一律 403。
  # 默认 true（演示环境需要能直接调），线上怀疑重建类接口引发抖动时改这里一键关闭。
  maintenance:
    enabled: true
  # 服务间内部调用凭证（默认值见下）。
  # 用途：UserInfoInterceptor 只在该请求头与下面这个值完全一致时才采信 user-info 头 ——
  # 服务监听 0.0.0.0，"能收到 user-info 头"不代表身份来自网关，直连端口可以自己伪造一个。
  # 凭证由网关（认证通过后）与 Feign（DefaultFeignConfig）注入，网关会剥离外部自带的同名头。
  # llmall-internal-demo-token 仅用于本地演示：生产应由网关注入/配置中心下发且不对外暴露，
  # 并配合内网隔离；全项目所有服务必须配置成同一个值，否则会出现"请求全部未登录"。
  internal:
    token: llmall-internal-demo-token

# ---------------------------------------------------------------------------
# 接口文档：knife4j 4.x 的 openapi3 分支（底层 springdoc-openapi，仍在维护）。
# 旧方案 knife4j 2.x/openapi2 底层是 springfox 2.10.5（2020 年后停更），与 Spring Boot 2.6+
# 有启动期 NPE 的已知不兼容，只能靠"关掉接口文档"绕过。现已整体换到 openapi3：
#   UI 地址 /doc.html      OpenAPI JSON /v3/api-docs
# 注解同步迁到 swagger v3（io.swagger.v3.oas.annotations）；
# springdoc 直接吃 Boot 2.6+ 默认的 PathPatternParser，不再需要 ant_path_matcher 兼容开关。
# ---------------------------------------------------------------------------
knife4j:
  enable: true
  setting:
    language: zh_cn
springdoc:
  api-docs:
    path: /v3/api-docs
  # 每个服务是一个独立限界上下文，直接扫本应用全部 controller，不必按包名逐个列举
  group-configs:
    - group: default
      paths-to-match: '/**'
      packages-to-scan: com.llmall
