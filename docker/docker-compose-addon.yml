# 基础设施补充编排：只补充 Seata 与 Elasticsearch / Kibana 栈，并接入同一容器网络（local-life），避免端口与数据卷冲突。
# 【注意·端口绑定】同上（infra-lite）：宿主端口一律绑 127.0.0.1。ES / Kibana / Seata 控制台都是运维面，
#   没有对外暴露的需求；从另一台机器访问会连不上，这是有意为之（需要时用 ssh 端口转发）。

services:
  # Seata Server 1.5.2：与 SCA 2021.0.4.0 带的 seata 客户端 1.5.2 对齐（服务端版本需 ≥ 客户端）。
  # 【注意】1.5.2 起服务端为 Spring Boot 应用，只认 application.yml；1.4.2 的 registry.conf/file.conf 在该镜像里已不存在。
  seata-server:
    image: seataio/seata-server:1.5.2
    container_name: seata-server
    ports:
      - "127.0.0.1:8091:8091"   # Seata 服务端口（客户端连接用）
      - "127.0.0.1:7091:7091"   # 用户控制台（1.5.1 起才有，账号见 ./seata/application.yml）
    environment:
      # 【注意】必须显式指定注册 IP：容器默认会把 172.x 容器内网 IP 注册进 Nacos，Windows/其它机器连不上。
      - SEATA_IP=${VM_IP:-192.168.189.128}
      - TZ=Asia/Shanghai              # 时区口径统一 CST
    volumes:
      - ./seata/application.yml:/seata-server/resources/application.yml:ro
      # Alpine 镜像没有 tzdata（连 jre/lib/zi 都缺），必须挂宿主时区文件，否则 JVM 仍打 UTC 日志
      - /etc/localtime:/etc/localtime:ro
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
    networks:
      - infra-net
    restart: unless-stopped

  # Elasticsearch 7.17.x：与 Spring Boot 2.7 的 spring-data-elasticsearch 4.4 对齐。
  # 【注意】需要宿主（VM）内核参数 vm.max_map_count >= 262144。
  elasticsearch:
    image: elasticsearch:7.17.10
    container_name: es
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m      # 单机小内存配置，避免和 Nacos 抢内存
      - xpack.security.enabled=false
      - bootstrap.memory_lock=true
      - TZ=Asia/Shanghai
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es-data:/usr/share/elasticsearch/data
      - ./es/plugins:/usr/share/elasticsearch/plugins   # 把 IK 分词器解压到这里（目录名必须是 ik）
    ports:
      # 宿主 9200/9300 已空出（原 hmall 的 ES 已停用），恢复默认端口；容器间仍走 es:9200。
      - "127.0.0.1:9200:9200"
      - "127.0.0.1:9300:9300"
    networks:
      - infra-net
    restart: unless-stopped

  # Kibana：可选，用来调索引、演示搜索效果
  kibana:
    image: kibana:7.17.10
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - I18N_LOCALE=zh-CN
      - TZ=Asia/Shanghai
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - infra-net
    restart: unless-stopped

networks:
  # 【注意】网络名统一到 local-life（与另外两份 compose 相同），Seata / ES 才能被应用容器按名字访问（应用侧 LLMALL_ES_HOST=elasticsearch 就靠它解析）。
  infra-net:
    external: true
    name: ${APP_NETWORK:-local-life}

volumes:
  es-data:
