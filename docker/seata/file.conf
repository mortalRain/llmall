# ============================================================================
# Seata Server 1.4.2 · file.conf
#
# 关键：store.mode = "db" —— 全局事务会话存进 MySQL 的 seata 库
#       （所以 seata 库必须有 global_table / branch_table / lock_table 三张表，
#        脚本来自 Seata 1.4.2 发行包 script/server/db/mysql.sql）
#
# Seata 读配置时会与 jar 内置的默认 file.conf 合并，因此本文件只写需要覆盖的项即可。
# 挂载位置见 docker/docker-compose-infra-lite.yml 的 seata 服务。
# ============================================================================

transport {
  type = "TCP"
  server = "NIO"
  heartbeat = true
  enableClientBatchSendRequest = true
}

store {
  mode = "db"

  db {
    datasource = "druid"
    dbType = "mysql"
    driverClassName = "com.mysql.cj.jdbc.Driver"
    # seata 库在 VM 的 MySQL 里；容器通过 local-life 网络直接用容器名 mysql 更稳，
    # 这里写宿主 IP 是为了「容器网络没接好时也能连上」的兜底 —— 两种都能用。
    url = "jdbc:mysql://192.168.189.128:3306/seata?useUnicode=true&characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true"
    user = "root"
    password = "123"
    minConn = 5
    maxConn = 30
    globalTable = "global_table"
    branchTable = "branch_table"
    lockTable = "lock_table"
    queryLimit = 100
    maxWait = 5000
  }
}

# 事务分组：客户端 seata.tx-service-group 与 seata.service.vgroup-mapping 要能对上
service {
  vgroupMapping {
    llmall-tx-group = "default"
  }
  # 关掉降级（没有其它 TC 集群时，降级会掩盖问题）
  disableGlobalTransaction = false
}
