# Seata Server 1.5.2 配置，挂载到容器的 /seata-server/resources/application.yml
# 【注意】1.5.x 起服务端改成 Spring Boot 应用，配置只认本文件；1.4.2 的 registry.conf/file.conf
# 在 1.5.2 镜像里已不存在，继续挂载会表现为改了配置不生效。

server:
  port: 7091                              # 控制台端口

spring:
  application:
    name: seata-server

logging:
  config: classpath:logback-spring.xml
  file:
    path: ${user.home}/logs/seata

console:
  user:
    username: seata                       # 控制台登录账号（http://<VM_IP>:7091）
    password: seata

seata:
  config:
    type: file                            # 服务端配置只认本文件，不接 Nacos 配置中心

  registry:
    type: nacos
    nacos:
      application: seata-server
      server-addr: 192.168.189.128:8848
      group: SEATA_GROUP
      namespace: ""
      cluster: default                    # 必须与客户端 service.vgroupMapping.xxx=default 一致
      username: ""
      password: ""                        # Nacos 未开鉴权

  server:
    service-port: 8091                    # 客户端连接的 TC 端口

  store:
    mode: db                              # 会话/锁都落库
    db:
      datasource: druid
      db-type: mysql
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://192.168.189.128:3306/seata?useUnicode=true&characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
      user: root
      password: "123"
      min-conn: 5
      max-conn: 30
      # 【注意】distributed_lock 是 1.5.x 新增的第 4 张表（建表见 sql/merged/03b-seata-server-1.5.2-upgrade.sql），缺表会导致定时任务抢不到锁
      global-table: global_table
      branch-table: branch_table
      lock-table: lock_table
      distributed-lock-table: distributed_lock
      query-limit: 100
      max-wait: 5000

  security:
    secretKey: SeataSecretKey0c382ef121d778043159209298fd40bf3850a017
    tokenValidityInMilliseconds: 1800000
    ignore:
      urls: /,/**/*.css,/**/*.js,/**/*.html,/**/*.map,/**/*.svg,/**/*.png,/**/*.ico,/console-fe/public/**,/api/v1/auth/login
