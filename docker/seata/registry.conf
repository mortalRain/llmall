# ============================================================================
# Seata Server 1.4.2 · registry.conf
#
# 用途：告诉 seata-server「注册中心用 Nacos、配置用本目录的 file.conf」。
# 挂载位置见 docker/docker-compose-infra-lite.yml 的 seata 服务：
#   ./seata/registry.conf -> /root/seata-config/registry.conf
#   ./seata/file.conf     -> /root/seata-config/file.conf
# 启动时由环境变量指定用哪个配置文件名：
#   SEATA_CONFIG_NAME=file:/root/seata-config/registry   ← 就是本文件
#
# 为什么 config.type 选 file 而不是 nacos：
#   选 nacos 需要额外把 seataServer.properties 导入 Nacos（多一步、多一个失败点）；
#   选 file 则全部配置都在本目录，起容器即可用。以后要做「配置也集中到 Nacos」再换。
# ============================================================================

registry {
  # 注册中心：Nacos（与各微服务同一套，SEATA_IP 由 compose 传入 VM 的宿主 IP）
  type = "nacos"

  nacos {
    application = "seata-server"
    serverAddr = "192.168.189.128:8848"
    group = "SEATA_GROUP"
    namespace = ""
    cluster = "default"
    # Nacos 未开鉴权（docker-compose-infra-lite.yml 里 NACOS_AUTH_ENABLE=false），故留空
    username = ""
    password = ""
  }
}

config {
  # 配置中心：用本地文件（见 file.conf 的 store.mode = db）
  type = "file"

  file {
    name = "file.conf"
  }
}
