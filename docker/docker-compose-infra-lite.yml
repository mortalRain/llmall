# 基础设施编排（低内存版）：MySQL 512M + Redis 160M + Nacos 640M + RabbitMQ 320M 常驻，合计约 1.6G。
# Seata 与 Elasticsearch 归入 profile=full，按需再起：
#   docker compose -f docker-compose-infra-lite.yml --profile full up -d seata
#   docker compose -f docker-compose-infra-lite.yml --profile full up -d elasticsearch
# 首次初始化：按 ../sql/merged/README.md 的顺序手动导入 SQL（原商城脚本 → 建库 → 改造脚本 → undo_log → 基础设施表）。
# 【注意】必须先建共用网络再 up，网络名须与 llmall/deploy 下两份 compose 的 APP_NETWORK 一致：
#   docker network create local-life
#   不建网络的表现为应用容器报 java.net.UnknownHostException: mysql。
# 【注意】本文件面向全新机器：会新建 mysql / redis / nacos / rabbitmq 容器并占用 3306 / 6379 / 8848 / 5672。
#   VM 上已有现役容器（mysql、nacos、mq，另有原生安装的 Redis），直接 up 会因容器名已存在 / 端口已分配起不来，
#   且新容器使用新数据卷（库表全空）；VM 场景改为接入现役容器：
#   docker network connect local-life mysql && docker network connect local-life nacos && docker network connect local-life mq
# 【注意】VM 上 RabbitMQ 容器名是 mq（不是 rabbitmq），Redis 不在容器里，须用宿主 IP 访问。
# 【注意·端口绑定】本文件所有宿主端口映射一律绑 127.0.0.1，不监听 0.0.0.0：
#   中间件没有任何"对外提供服务"的需求，绑到所有网卡等于把 MySQL/Redis/Nacos/RabbitMQ 管理台
#   连同它们的认证面一起暴露给同网段。应用容器之间走 local-life 网络按容器名互访，不经过宿主端口，
#   因此收紧之后本机浏览器/本机压测全部照旧。
#   【副作用·有意】从另一台机器发起压测会连不上（宿主的 127.0.0.1 不可远程访问）；
#   真需要远程压测时，改回 0.0.0.0 或用 ssh 端口转发，不要把绑定改回默认值当"修复"。

services:
  mysql:
    image: mysql:8.0.27
    container_name: mysql
    command:
      - --innodb-buffer-pool-size=128M     # InnoDB 缓冲池上限：128M-256M 够开发用，不设会占用 1G+
      - --performance-schema=OFF           # 关闭 performance_schema，可省 200-400M 内存
      - --max-connections=100
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+08:00
    environment:
      # 【注意】口令不再硬编码：来自 deploy/.env（不入库），由 demo.ps1 以 --env-file 传入。
      # 缺失时 compose 直接报错退出，而不是静默用某个默认值把环境起歪。
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 deploy/.env 中设置 MYSQL_ROOT_PASSWORD（示例值见 deploy/.env.example）}
      TZ: Asia/Shanghai
    ports:
      # 宿主端口可用 MYSQL_HOST_PORT 覆盖：本机已装原生 MySQL 服务（占着 3306）时设
      # MYSQL_HOST_PORT=3307 再 up 即可，不必停掉那套 MySQL。容器内端口恒为 3306，
      # 应用容器之间仍按容器名 + 3306 互访，不受影响；demo.ps1 的 -DbHostPort 是同一口径。
      - "127.0.0.1:${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    mem_limit: 512m
    restart: unless-stopped

  redis:
    image: redis:7.2
    container_name: redis
    # 一个容器里同时跑 redis 主节点与 3 个哨兵（26379/26380/26381），原因见 ./redis/entrypoint.sh 头部：
    # nacos-config/shared-redis.yaml 把哨兵地址写成 ${llmall.redis.host}:26379..26381，
    # 即"哨兵与 redis 同机"。VM / 生产就是原生同机部署；容器里要沿用这份配置，
    # 哨兵就必须与 redis 同主机名同 IP —— 拆成独立容器会让应用连 redis:26379 落空。
    # 口令、内存上限、关闭持久化等原来写在 command 里的参数，全部搬进了 entrypoint 脚本。
    entrypoint: ["/bin/sh", "/usr/local/bin/redis-entrypoint.sh"]
    environment:
      # 【注意】口令须与各服务 application-local.yaml / Nacos 的 llmall.redis.pw 一致：
      # VM 上为 123456（不是 123），写错表现为启动即 Redis 连接失败。
      # 口令本身不写在这里：来自 deploy/.env（不入库），缺失时 compose 直接报错。
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 deploy/.env 中设置 REDIS_PASSWORD（示例值见 deploy/.env.example）}
    volumes:
      - ./redis/entrypoint.sh:/usr/local/bin/redis-entrypoint.sh:ro
    ports:
      - "127.0.0.1:6379:6379"
      - "127.0.0.1:26379:26379"                      # 三个哨兵端口映射到宿主，便于排障（应用走容器网络）
      - "127.0.0.1:26380:26380"
      - "127.0.0.1:26381:26381"
    mem_limit: 224m
    restart: unless-stopped

  nacos:
    image: nacos/nacos-server:v2.2.3
    container_name: nacos
    environment:
      MODE: standalone                    # 单机模式 + 内嵌 derby，无需外部数据库
      JVM_XMS: 256m
      JVM_XMX: 384m
      JVM_XMN: 128m
      NACOS_AUTH_ENABLE: "false"
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:8848:8848"
      - "127.0.0.1:9848:9848"                       # Nacos 2.x 客户端 gRPC 端口，缺一则客户端连不上
    mem_limit: 640m
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.11-management
    container_name: mq                         # 【注意】须与 VM 现役容器名一致，历史上叫 mq，不要改成 rabbitmq
    # 【注意】必须显式固定 hostname：RabbitMQ 节点名是 rabbit@<hostname>，docker 默认取容器 ID，
    # 容器重建后节点名变化会让 mnesia 旧数据成为孤儿目录，表现为数据卷还在但 vhost/队列/交换机全丢。
    hostname: mq
    environment:
      RABBITMQ_DEFAULT_USER: llmall
      RABBITMQ_DEFAULT_PASS: "123"
      RABBITMQ_DEFAULT_VHOST: /llmall
      # 【注意】延迟消息插件：trade 的超时未支付自动关单依赖 x-delayed-message 交换机。
      # 官方镜像不含这个社区插件（它属于社区插件，不在 rabbitmq 官方镜像里），且从 v3.12.0 起才提供 .ez 发行物，故把插件文件随仓库带在
      # mq-plugins/ 下并挂进容器（容器重建后仍在），启用状态写进数据卷里的 enabled_plugins：
      #   docker exec mq rabbitmq-plugins enable rabbitmq_management rabbitmq_delayed_message_exchange
      # demo.ps1 在 infra 起来后会自动执行这一步（幂等）；漏了它 trade-service 起不来，
      # 症状是 NOT_FOUND / Failed to declare queue(s):[trade.delay.order.queue]。
      RABBITMQ_ENABLED_PLUGINS_FILE: /var/lib/rabbitmq/enabled_plugins
      # 内存水位不再用 RABBITMQ_VM_MEMORY_HIGH_WATERMARK 设置：RabbitMQ 3.11 起该环境变量已废弃，
      # 设了它容器会直接以 "deprecated environment variables detected" 退出（restart 循环）。
      # 默认相对水位就是 0.4（达 40% 阻塞生产者），与这里想要的"达阈值即阻塞生产者"语义一致，故留空即可；
      # 真要改就挂配置文件，别再用这个变量。
      TZ: Asia/Shanghai                    # 时区统一 CST；仅设 TZ 不够，还需挂载宿主时区文件（见下）
    volumes:
      # 镜像不带 tzdata：只设 TZ 时日志仍为 UTC，必须挂载宿主时区文件
      - /etc/localtime:/etc/localtime:ro
      # mnesia 数据（vhost/用户/队列/交换机/消息）须落卷，否则容器一删全丢
      - mq-data:/var/lib/rabbitmq
      # 延迟消息插件（.ez）：挂进镜像自带的插件目录，容器重建后不用重新 docker cp
      - ./mq-plugins/rabbitmq_delayed_message_exchange-3.12.0.ez:/opt/rabbitmq/plugins/rabbitmq_delayed_message_exchange-3.12.0.ez:ro
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    mem_limit: 320m
    restart: unless-stopped

  # 按需启动（profile=full）
  seata:
    image: seataio/seata-server:1.5.2
    container_name: seata-server
    profiles: ["full"]
    ports:
      - "127.0.0.1:8091:8091"
      - "127.0.0.1:7091:7091"                         # 用户控制台端口（1.5.1 起提供）
    environment:
      # 【注意】注册 IP 必须显式指定，否则会把容器内网 IP（172.x）注册进 Nacos，宿主上的服务连不上
      SEATA_IP: ${VM_IP:-192.168.189.128}
      # 控制台账号与 TC 落库口令：来自 deploy/.env（不入库），由 seata/application.yml 以 ${...} 引用。
      SEATA_CONSOLE_PASSWORD: ${SEATA_CONSOLE_PASSWORD:?请在 deploy/.env 中设置 SEATA_CONSOLE_PASSWORD}
      SEATA_DB_PW: ${SEATA_DB_PW:?请在 deploy/.env 中设置 SEATA_DB_PW}
      # 【注意】时区统一 CST：镜像为 Alpine，内部无时区库，只挂 /etc/localtime 时 JVM 仍按 UTC 打日志，
      # 故需连宿主 /usr/share/zoneinfo 一起挂载，JDK 才能解析到 Asia/Shanghai。
      TZ: Asia/Shanghai
    volumes:
      - ./seata/application.yml:/seata-server/resources/application.yml:ro
      - /etc/localtime:/etc/localtime:ro
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
    mem_limit: 512m
    restart: unless-stopped

  elasticsearch:
    image: elasticsearch:7.17.10
    container_name: es
    profiles: ["full"]
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m   # 单节点小数据量够用；不要用默认 1G
      - xpack.security.enabled=false
      - bootstrap.memory_lock=false      # 关闭 memlock，容器更易启动
      - TZ=Asia/Shanghai
    volumes:
      - es-data:/usr/share/elasticsearch/data
      - ./es/plugins:/usr/share/elasticsearch/plugins
    ports:
      - "127.0.0.1:9200:9200"
    mem_limit: 1g
    restart: unless-stopped
    # Kibana 不再编排（省 1G），调试索引直接用 curl 或浏览器 _cat API

volumes:
  mysql-data:
  es-data:
  # 【注意】RabbitMQ 的 mnesia 数据（vhost/用户/队列/交换机/消息）必须落卷，否则容器一删全清；
  # 与上面的固定 hostname 配合，才能做到重建容器不丢 MQ 状态。
  mq-data:

# 【注意】把 compose 默认网络改名为共用的 external 网络：本文件所有服务自动接入，无需逐个写 networks:；
# 网络名须与 docker-compose-addon.yml、llmall/deploy/docker-compose-apps.yml 一致，否则容器之间无法按名字解析，
# 顺序必须是先 docker network create local-life，再 up。
networks:
  default:
    name: ${APP_NETWORK:-local-life}
    external: true
