# bootstrap 阶段就要知道应用名与配置中心地址，所以这些必须写在这里（不能只写在 application.yaml）。
spring:
  application:
    name: llmall-user-service # 核心标识，Nacos 注册与配置、日志里的服务名都依赖它
  profiles:
    # local：本机/虚拟机地址（VM 里的容器名 mysql/mq/redis 只有在 docker 网络内才解析得到）
    active: local
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:192.168.189.128:8848}
      # 服务发现
      discovery:
        namespace: ${NACOS_NAMESPACE:public}
      # 配置中心：shared-*.yaml 是"跨服务的同一份口径"，改动在 Nacos 上发布即对所有服务生效
      config:
        server-addr: ${NACOS_ADDR:192.168.189.128:8848}
        file-extension: yaml
        shared-configs:
          - dataId: shared-jdbc.yaml
            refresh: true
          - dataId: shared-mybatis.yaml
            refresh: true
          # 验证码、refresh token 白名单、令牌黑名单都在 Redis 上（双 token 与主动失效）
          - dataId: shared-redis.yaml
            refresh: true
          # 消费 order.paid 事件发放积分（亮点 B 的消费端）
          - dataId: shared-mq.yaml
            refresh: true
          - dataId: shared-log.yaml
            refresh: true
          - dataId: shared-swagger.yaml
            refresh: true
