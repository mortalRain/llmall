server:
  port: 8084
spring:
  application:
    name: llmall-user-service
  profiles:
    # 本地开发用 local：数据库/Redis 指向虚拟机 192.168.189.128
    # 注意：原配置是 dev，而 application-dev.yaml 里的 host 是容器名 mysql，
    # 只有当服务本身也跑在 docker 网络里才通；在 IDEA 里跑必须用 local。
    active: local
  datasource:
    url: jdbc:mysql://${llmall.db.host}:3306/llmall-user?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${llmall.db.pw}
  redis:
    host: ${llmall.redis.host}
    port: 6379
    password: ${llmall.redis.pw}
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
  rabbitmq:
    # 消费 order.paid 事件发放积分（亮点 B 的消费端）
    host: ${llmall.mq.host}
    port: 5672
    virtual-host: /llmall
    username: llmall
    password: 123
  cloud:
    sentinel:
      transport:
        # Sentinel 控制台地址：默认值按"控制台与应用同机（宿主 8090）"取，
        # 换环境（控制台在 VM / 云服务器上）用启动参数 --llmall.sentinel.dashboard=ip:8090、
        # 环境变量 LLMALL_SENTINEL_DASHBOARD，或 Nacos 配置里加 llmall.sentinel.dashboard 覆盖，均无需改代码。
        # 控制台自身默认端口是 8080，会和网关冲突，启动时必须显式指定 8090。
        # 控制台不在线只是连接告警，不影响 @SentinelResource 定义的限流/降级生效。
        dashboard: ${llmall.sentinel.dashboard:localhost:8090}
    nacos:
      # 占位符 + 默认值：本地开发落到 VM 地址；容器化时由 compose 注入 NACOS_ADDR=nacos:8848 覆盖。
      # 写成字面量会让"容器里按容器名解析"这条路径静默失效（表现为注册到不可达 IP）。
      server-addr: ${NACOS_ADDR:192.168.189.128:8848}
mybatis-plus:
  configuration:
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    db-config:
      update-strategy: not_null
      id-type: auto
logging:
  level:
    # info 而非 debug：Feign 日志级别已降为 BASIC，com.llmall 若仍是 debug，
    # 会把每条 MyBatis SQL 与参数都打出来（噪音大、拖慢压测，且可能把参数里的敏感值写进日志）。
    com.llmall: info
  pattern:
    dateformat: HH:mm:ss:SSS
  file:
    path: "logs/${spring.application.name}"
llmall:
  jwt:
    location: classpath:llmall.jks
    alias: llmall
    password: llmall123
    tokenTTL: 30m      # access token：短
    refreshTTL: 7d     # refresh token：长，用于无感刷新
  debug:
    # 越权自测接口开关（/users/_debug/**）：**默认关闭**。
    # 它会把"下游实际收到的 user-info 头与被采信的身份"直接回显，是攻击者最想要的侦察端点；
    # 只在跑越权验收（scripts/verify-auth.ps1）时临时打开，跑完立刻关回去。
    enabled: false
  # 服务间内部调用凭证（默认值见下）。
  # 用途：UserInfoInterceptor 只在该请求头与下面这个值完全一致时才采信 user-info 头 ——
  # 服务监听 0.0.0.0，"能收到 user-info 头"不代表身份来自网关，直连端口可以自己伪造一个。
  # 凭证由网关（认证通过后）与 Feign（DefaultFeignConfig，如 llmall-pay-service 的扣款调用）注入，
  # 网关会剥离外部请求自带的同名头。llmall-internal-demo-token 仅用于本地演示：
  # 生产应由网关注入/配置中心下发且不对外暴露，并配合内网隔离；全项目必须配成同一个值。
  internal:
    token: llmall-internal-demo-token
    # 服务间调用凭证：网关只剥离、不注入，外部（含已登录用户）拿不到。
    # 资金类内部接口（/users/money/deduct、/users/money/refund）用它做入口守卫，
    # 全项目必须配成同一个值；不配置则这些接口一律 403（fail-closed）。
    service-token: llmall-service-demo-token
# keytool -genkeypair -alias llmall -keyalg RSA -keypass llmall123 -keystore llmall.jks -storepass llmall123

# ---------------------------------------------------------------------------
# 接口文档：knife4j 4.x 的 openapi3 分支（底层 springdoc-openapi，仍在维护）。
# 旧方案 knife4j 2.x/openapi2 底层是 springfox 2.10.5（2020 年后停更），与 Spring Boot 2.6+
# 有启动期 NPE 的已知不兼容，只能靠"关掉接口文档"绕过。现已整体换到 openapi3：
#   UI 地址 /doc.html      OpenAPI JSON /v3/api-docs
# 注解同步迁到 swagger v3（io.swagger.v3.oas.annotations）；
# springdoc 直接吃 Boot 2.6+ 默认的 PathPatternParser，不再需要 ant_path_matcher 兼容开关。
# ---------------------------------------------------------------------------
knife4j:
  enable: true
  setting:
    language: zh_cn
springdoc:
  api-docs:
    path: /v3/api-docs
  # 每个服务是一个独立限界上下文，直接扫本应用全部 controller，不必按包名逐个列举
  group-configs:
    - group: default
      paths-to-match: '/**'
      packages-to-scan: com.llmall


# ---------------------------------------------------------------------------
# 运行指标暴露（其余 6 个服务从 Nacos 的 shared-log.yaml 拿同一份配置；
# 这 4 个服务没有独立 bootstrap，所以在本地补一份，保证 /actuator/prometheus 口径一致）。
# prometheus 端点用于压测与容量规划（QPS/RT/连接池/JVM），/actuator/** 不进网关白名单，仅内网直连。
# 注意：本文件是**权威来源**，不要为了"少写几行"把它挪走 —— 挪到 Nacos 需要先给这 4 个服务补 bootstrap。
# ---------------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never