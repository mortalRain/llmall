server:
  port: 8081

feign:
  # OkHttp 连接池（依赖 pom 中的 feign-okhttp），避免每次调用都新建 TCP 连接
  okhttp:
    enabled: true
  # 【注意】必须开启，否则 llmall-api 声明的 fallbackFactory（ItemClientFallback/PayClientFallback/ShopClientFallback）不生效
  sentinel:
    enabled: true
  client:
    config:
      default:
        # 连接 2s / 读取 5s。
        # 【注意】必须显式配：Feign 默认没有读超时，下游 hang 住时调用方会一直等，最终把线程池与连接池一起耗尽（而不是快速失败 + 走兜底）。
        connectTimeout: 2000
        readTimeout: 5000
# Seata AT：本服务是 RM（扣库存的参与方），默认关闭。
seata:
  enabled: false
  application-id: llmall-item-service
  tx-service-group: llmall-tx-group
  enable-auto-data-source-proxy: true
  data-source-proxy-mode: AT
  service:
    vgroup-mapping:
      llmall-tx-group: default
  registry:
    type: nacos
    nacos:
      application: seata-server
      server-addr: ${NACOS_ADDR:192.168.189.128:8848}
      group: SEATA_GROUP
      cluster: default
  config:
    type: file
spring:
  application:
    name: llmall-item-service
  profiles:
    # 【注意】必须用 local：dev 里的 llmall.db.host 是容器名 mysql，只有在 docker 网络里才解析得到，
    # 在 IDEA / 本机 java -jar 下会报 java.net.UnknownHostException: mysql。
    active: local
  # 数据源（url / driver / 账号 / hikari 池参数）统一来自 Nacos 的 shared-jdbc.yaml，本文件不再复制一份。
  # 【注意】复制出来的那份会与 Nacos 漂移，而"看起来配了、其实被 Nacos 覆盖"是最难查的一类问题。
  # 库名由下方的 llmall.db.database 提供，host/pw 在 application-local.yaml。
  cloud:
    sentinel:
      transport:
        # Sentinel 控制台地址，默认按"控制台与应用同机（宿主 8090）"取值。
        # 换环境（控制台在 VM / 云服务器上）可用启动参数 --llmall.sentinel.dashboard=ip:8090、环境变量 LLMALL_SENTINEL_DASHBOARD 或 Nacos 配置覆盖，无需改代码。
        # 【注意】控制台自身默认端口是 8080，会和网关冲突，启动时必须显式指定 8090；控制台不在线只是连接告警，不影响 @SentinelResource 定义的限流/降级生效。
        dashboard: ${llmall.sentinel.dashboard:localhost:8090}
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:192.168.189.128:8848}
# MyBatis-Plus 公共配置（枚举处理器 / 驼峰映射 / 更新策略 / 主键策略）来自 Nacos 的 shared-mybatis.yaml。
logging:
  # 日志级别与输出格式来自 Nacos 的 shared-log.yaml；这里只留"按服务名分目录"这一项服务私有配置。
  pattern:
    dateformat: HH:mm:ss:SSS
  file:
    path: "logs/${spring.application.name}"
llmall:
  db:
    # 库名：shared-jdbc.yaml 用 ${llmall.db.database} 拼 url；host/pw 在 application-local.yaml。
    database: llmall-item
  jwt:
    location: ${LLMALL_JKS_LOCATION:classpath:llmall.jks}
    alias: llmall
    password: ${LLMALL_JKS_PASSWORD:llmall123}
    tokenTTL: 30m
  # 服务间内部调用凭证：仅当请求头与该值完全一致时，UserInfoInterceptor 才采信 user-info 头
  # （服务监听 0.0.0.0，"我能收到 user-info 头"并不等于"这个身份来自网关"，直连服务端口可以自己写一个 user-info 冒充任意用户）。
  # 由网关（认证通过后）与 Feign 调用（DefaultFeignConfig）注入，网关会剥离外部请求自带的同名头。
  # 【注意】全项目所有服务必须配置成同一个值，否则会出现"网关进来的请求全部未登录"或"服务间调用被当成伪造头"。
  # 默认值 llmall-internal-demo-token 仅用于本地演示：生产应由网关注入/配置中心下发，该值不对外暴露，并配合内网隔离。
  internal:
    token: ${LLMALL_INTERNAL_TOKEN:llmall-internal-demo-token}
    # 服务间调用专用凭证 llmall.internal.service-token：商品写接口（新增/改状态/更新/删除/库存扣减/库存回滚）在控制器入口校验它。
    # 这些接口都能直接改库存与商品状态，若能匿名调用，任何人一个请求就能把某商品库存清零。
    # 【注意】不配置则这些接口一律 403（fail-closed），宁可内部调用报错也不能对外开放；网关只剥离、不注入该头，外部拿不到它，
    # Feign 调用由 DefaultFeignConfig 自动带上。
    service-token: ${LLMALL_SERVICE_TOKEN:llmall-service-demo-token}

# 接口文档：knife4j 4.x 的 openapi3 分支（底层 springdoc-openapi），UI 地址 /doc.html，OpenAPI JSON /v3/api-docs
# 注解用 swagger v3（io.swagger.v3.oas.annotations）；springdoc 直接吃 Boot 2.6+ 默认的 PathPatternParser，无需 ant_path_matcher 兼容开关。
knife4j:
  enable: true
  setting:
    language: zh_cn
springdoc:
  api-docs:
    path: /v3/api-docs
  # 每个服务是一个独立限界上下文，直接扫本应用全部 controller，不必按包名逐个列举
  group-configs:
    - group: default
      paths-to-match: '/**'
      packages-to-scan: com.llmall


# 运行指标暴露（health/info/metrics/prometheus、liveness/readiness 探针、Sentinel 健康指标关闭）统一来自 Nacos 的 shared-log.yaml。
# 【注意】/actuator/** 不进网关白名单，仅内网直连；prometheus 端点用于压测与容量规划（QPS/RT/连接池/JVM）。