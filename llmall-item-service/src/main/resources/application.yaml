server:
  port: 8081
# Seata AT：本服务是 RM（扣库存的参与方）。默认关闭，见 llmall-trade-service 里的同名字段说明。
seata:
  enabled: false
  application-id: llmall-item-service
  tx-service-group: llmall-tx-group
  enable-auto-data-source-proxy: true
  data-source-proxy-mode: AT
  service:
    vgroup-mapping:
      llmall-tx-group: default
  registry:
    type: nacos
    nacos:
      application: seata-server
      server-addr: ${NACOS_ADDR:192.168.189.128:8848}
      group: SEATA_GROUP
      cluster: default
  config:
    type: file
spring:
  application:
    name: llmall-item-service
  profiles:
    # 必须用 local：dev 里的 llmall.db.host 是容器名 mysql，只有在 docker 网络里才解析得到，
    # 在 IDEA / 本机 java -jar 下会报 java.net.UnknownHostException: mysql（实测踩过）
    active: local
  datasource:
    url: jdbc:mysql://${llmall.db.host}:3306/llmall-item?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${llmall.db.pw}
    hikari:
      # 连接池上限压到 5（默认是 10）：11 个服务 × 10 条 = 110 条，已接近 MySQL 默认 max_connections=151。
      # 更隐蔽的是"服务被杀后连接不会立刻释放"——要等 MySQL wait_timeout（默认 8 小时）才回收，
      # 反复重启几次就能把连接数打满（实测踩过：Too many connections，连 root 都被拒之门外）。
      # 本地/演示负载下 5 条足够，且把最坏情况从 110 降到 55。
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 5000
      idle-timeout: 60000
      max-lifetime: 600000
  cloud:
    sentinel:
      transport:
        # Sentinel 控制台地址：默认值按"控制台与应用同机（宿主 8090）"取，
        # 换环境（控制台在 VM / 云服务器上）用启动参数 --llmall.sentinel.dashboard=ip:8090、
        # 环境变量 LLMALL_SENTINEL_DASHBOARD，或 Nacos 配置里加 llmall.sentinel.dashboard 覆盖，均无需改代码。
        # 控制台自身默认端口是 8080，会和网关冲突，启动时必须显式指定 8090。
        # 控制台不在线只是连接告警，不影响 @SentinelResource 定义的限流/降级生效。
        dashboard: ${llmall.sentinel.dashboard:localhost:8090}
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:192.168.189.128:8848}
mybatis-plus:
  configuration:
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    db-config:
      update-strategy: not_null
      id-type: auto
logging:
  level:
    # info 而非 debug：Feign 日志级别已降为 BASIC，com.llmall 若仍是 debug，
    # 会把每条 MyBatis SQL 与参数都打出来（噪音大、拖慢压测，且可能把参数里的敏感值写进日志）。
    com.llmall: info
  pattern:
    dateformat: HH:mm:ss:SSS
  file:
    path: "logs/${spring.application.name}"
llmall:
  jwt:
    location: classpath:llmall.jks
    alias: llmall
    password: llmall123
    tokenTTL: 30m
  # 服务间内部调用凭证（默认值见下）。
  # 用途：UserInfoInterceptor 只在该请求头与下面这个值完全一致时才采信 user-info 头 ——
  # 因为服务监听 0.0.0.0，"我能收到 user-info 头"并不等于"这个身份来自网关"，
  # 直连服务端口的人可以自己写一个 user-info 冒充任意用户。凭证由网关（认证通过后）
  # 与 Feign 调用（DefaultFeignConfig）注入，网关会剥离外部请求自带的同名头。
  # 默认值 llmall-internal-demo-token 仅用于本地演示：生产应由网关注入/配置中心下发，
  # 该值不对外暴露，并配合内网隔离。**全项目所有服务必须配置成同一个值**，否则会出现
  # "网关进来的请求全部未登录"或"服务间调用被当成伪造头"。
  internal:
    token: llmall-internal-demo-token
    # 【凭证二】llmall.internal.service-token：**只给服务间调用**用的凭证。
    # 商品写接口（新增/改状态/更新/删除/库存扣减/库存回滚）在控制器入口校验它 ——
    # 这些接口都能直接改库存与商品状态，若能匿名调用，任何人一个请求就能把某商品库存清零。
    # 网关照旧只剥离、不注入该头，所以外部拿不到它；Feign 调用由 DefaultFeignConfig 自动带上。
    # 必须显式配置：不配置则这些接口一律 403（fail-closed），宁可内部调用报错也不能对外开放。
    service-token: llmall-service-demo-token
# keytool -genkeypair -alias llmall -keyalg RSA -keypass llmall123 -keystore llmall.jks -storepass llmall123

# ---------------------------------------------------------------------------
# 接口文档：knife4j 4.x 的 openapi3 分支（底层 springdoc-openapi，仍在维护）。
# 旧方案 knife4j 2.x/openapi2 底层是 springfox 2.10.5（2020 年后停更），与 Spring Boot 2.6+
# 有启动期 NPE 的已知不兼容，只能靠"关掉接口文档"绕过。现已整体换到 openapi3：
#   UI 地址 /doc.html      OpenAPI JSON /v3/api-docs
# 注解同步迁到 swagger v3（io.swagger.v3.oas.annotations）；
# springdoc 直接吃 Boot 2.6+ 默认的 PathPatternParser，不再需要 ant_path_matcher 兼容开关。
# ---------------------------------------------------------------------------
knife4j:
  enable: true
  setting:
    language: zh_cn
springdoc:
  api-docs:
    path: /v3/api-docs
  # 每个服务是一个独立限界上下文，直接扫本应用全部 controller，不必按包名逐个列举
  group-configs:
    - group: default
      paths-to-match: '/**'
      packages-to-scan: com.llmall


# ---------------------------------------------------------------------------
# 运行指标暴露（其余 6 个服务从 Nacos 的 shared-log.yaml 拿同一份配置；
# 这 4 个服务没有独立 bootstrap，所以在本地补一份，保证 /actuator/prometheus 口径一致）。
# prometheus 端点用于压测与容量规划（QPS/RT/连接池/JVM），/actuator/** 不进网关白名单，仅内网直连。
# 注意：本文件是**权威来源**，不要为了"少写几行"把它挪走 —— 挪到 Nacos 需要先给这 4 个服务补 bootstrap。
# ---------------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never