server:
  port: 8085

feign:
  # OkHttp 连接池，避免每次调用都新建 TCP 连接
  okhttp:
    enabled: true
  # 让 Feign 的 fallbackFactory 真正生效（llmall-api 的 ItemClientFallback/PayClientFallback/ShopClientFallback）
  sentinel:
    enabled: true
  client:
    config:
      default:
        # 【注意】必须显式配：Feign 默认没有读超时，下游 hang 住时调用方会一直等，
        # 最终把线程池和连接池一起耗尽，而不是快速失败 + 走兜底（连接 2s / 读取 5s）。
        connectTimeout: 2000
        readTimeout: 5000
# Seata AT 强一致分支总开关（默认关闭）：false 只引依赖不使用 —— GlobalTransactionScanner 不注册、
# @GlobalTransactional 不生效，下单仍走原"本地事务 + 消息表"，不依赖 Seata 也能跑起来；
# true 则走 AT 全局事务（前提：Seata Server 已启动）。只翻这一个值即可做双方案对照压测。
seata:
  enabled: false
  application-id: llmall-trade-service
  tx-service-group: llmall-tx-group
  enable-auto-data-source-proxy: true
  data-source-proxy-mode: AT
  service:
    vgroup-mapping:
      llmall-tx-group: default
  registry:
    type: nacos
    nacos:
      application: seata-server
      server-addr: ${NACOS_ADDR:192.168.189.128:8848}
      group: SEATA_GROUP
      cluster: default
  config:
    type: file
spring:
  application:
    name: llmall-trade-service
  profiles:
    active: local
  # 数据源（url / driver / 账号 / hikari 池参数）统一来自 Nacos 的 shared-jdbc.yaml，本文件不再复制一份；
  # 库名由下方 llmall.db.database 提供，host/pw 在 application-local.yaml。
  cloud:
    loadbalancer:
      retry:
        # 【2026-10-15】显式关闭负载均衡层重试。本层与 Feign 层的 Retryer 是两套独立机制：
        # Feign 层已由 NoRetryFeignConfig 钉死为 NEVER_RETRY，而本层由 spring.cloud.loadbalancer.retry 控制（当前默认关闭）。
        # 写接口一旦在这层被重试就是重复扣款/重复下单，且不会有任何编译或运行时报错 —— 显式写死 false 防回归。
        enabled: false
    sentinel:
      transport:
        # Sentinel 控制台地址：默认"控制台与应用同机（宿主 8090）"，可用启动参数
        # --llmall.sentinel.dashboard=ip:8090、环境变量或 Nacos 配置覆盖，均无需改代码。
        # 【注意】控制台自身默认端口 8080 与网关冲突，必须显式指定 8090；控制台不在线只是连接告警，
        # 不影响 @SentinelResource 定义的限流/降级生效。
        dashboard: ${llmall.sentinel.dashboard:localhost:8090}
    nacos:
      server-addr: ${NACOS_ADDR:192.168.189.128:8848}
  # MQ 连接（host/port/vhost/账号）与消费口径（prefetch / 重试次数）统一来自 Nacos 的 shared-mq.yaml，
  # 本文件不再复制一份；地址由 application-local.yaml 的 llmall.mq.host 提供。
# MyBatis-Plus 公共配置来自 Nacos 的 shared-mybatis.yaml。
logging:
  # 日志级别与输出格式来自 Nacos 的 shared-log.yaml；这里只留"按服务名分目录"这一项服务私有配置。
  pattern:
    dateformat: HH:mm:ss:SSS
  file:
    path: "logs/${spring.application.name}"
llmall:
  db:
    # 库名：shared-jdbc.yaml 用 ${llmall.db.database} 拼 url；host/pw 在 application-local.yaml。
    database: llmall-trade
  # 【注意】本服务当前不解析 JWT：没有 JwtTool Bean、也没有 JwtProperties 绑定 —— 身份由网关注入的
  # user-info 头承载，UserInfoInterceptor 只校验内部凭证头后采信该头，不做验签、不需要密钥库。
  # 全项目只有 llmall-gateway 与 llmall-user-service 装配 JwtTool，因此本段不会生效（保留仅为口径一致）；
  # 要改令牌寿命请改那两处的 llmall.jwt.tokenTTL。若将来本服务要自行验签，
  # 须先补 KeyPair Bean 与 @EnableConfigurationProperties(JwtProperties.class)。
  jwt:
    location: ${LLMALL_JKS_LOCATION:classpath:llmall.jks}
    alias: llmall
    password: ${LLMALL_JKS_PASSWORD:llmall123}
    tokenTTL: 30m
  trade:
    # 订单支付超时（秒）：超时未支付则延迟消息关单并回滚库存；900 = 15 分钟。
    # 演示超时关单可临时改小（如 30），改后需重启 llmall-trade-service 生效。
    order-timeout-seconds: 900
    # 延迟消息查不到支付状态（支付服务不可用）时的最大重投次数，默认 5。
    # 【注意】超过后不再自动关单，只打 ERROR 日志让订单保持待付款等人工处理：
    # 未知状态绝不能当成"未支付"，关错单会让已付款用户钱货两空。
    order-close-max-retry: 5
    # 兜底扫描"超时却仍是待付款"订单的固定间隔（毫秒），默认 300000（5 分钟），
    # 用于补延迟消息丢失/服务重启期间漏掉的关单，判定口径与延迟消息完全一致。
    order-scan-interval-ms: 300000
  # 【凭证一】llmall.internal.token：网关注入的"本请求经过网关"凭证，也是 UserInfoInterceptor
  # 判断 user-info 头是否可信的依据（服务监听 0.0.0.0，直连端口可以自己伪造 user-info）。
  # 【注意】网关会剥离外部自带的该头并在认证通过后重新注入，外部无法伪造；但任何登录用户的请求
  # 都带着它，所以它不能用来判断"这是服务间调用"；生产应改由配置中心下发并配合内网隔离。
  internal:
    token: ${LLMALL_INTERNAL_TOKEN:llmall-internal-demo-token}
    # 【凭证二】llmall.internal.service-token：只给服务间调用用的凭证，用于"标记订单已支付"
    # 这类绝不能让用户触发的内部接口。与 x-internal-token 的区别：网关对 x-service-token 只剥离、
    # 不注入，外部（哪怕已登录用户）永远拿不到，只有真正的服务调用方（如 pay 的 Feign）持有。
    # 【注意】必须显式配置：不配置则内部接口一律 403（fail-closed），宁可内部调用报错也不能对外开放。
    service-token: ${LLMALL_SERVICE_TOKEN:llmall-service-demo-token}
# Feign 降级：ItemClient/PayClient/ShopClient 的 fallbackFactory 在 feign.sentinel.enabled=true 下才生效，
# 规则见 llmall-common 的 SentinelRuleConfig；资金/库存链路明确不降级（宁可报错也不能返回假成功），
# 只对读接口（如商品分页）限流 + 熔断并返回兜底数据。
# 【注意】启动期 NPE 已由配置规避：shared-log.yaml 关掉 sentinel 健康指标、本服务 sentinel.eager: false（不要再改回 true）。

# 接口文档：knife4j 4.x 的 openapi3 分支（底层 springdoc-openapi）；UI 地址 /doc.html，OpenAPI JSON /v3/api-docs。
# 【注意】旧方案 knife4j 2.x/openapi2 底层 springfox 2.10.5 已停更，与 Spring Boot 2.6+ 有启动期 NPE 的
# 已知不兼容；注解须用 swagger v3（io.swagger.v3.oas.annotations），也无需 ant_path_matcher 兼容开关。
knife4j:
  enable: true
  setting:
    language: zh_cn
springdoc:
  api-docs:
    path: /v3/api-docs
  # 每个服务是一个独立限界上下文，直接扫本应用全部 controller，不必按包名逐个列举
  group-configs:
    - group: default
      paths-to-match: '/**'
      packages-to-scan: com.llmall


# 运行指标（health/info/metrics/prometheus、liveness/readiness 探针、Sentinel 健康指标关闭）统一来自
# Nacos 的 shared-log.yaml；【注意】/actuator/** 不进网关白名单，仅内网直连。