# 本机环境值；换环境时用环境变量覆盖
llmall:
  db:
    host: 192.168.189.128
    pw: ${LLMALL_DB_PW:123}
  redis:
    host: 192.168.189.128
    pw: ${LLMALL_REDIS_PW:123456}   # 【注意】口令为 123456，与库口令 123 不同
  mq:
    host: 192.168.189.128
  es:
    # ES 部署在 Windows 宿主且服务也在宿主运行，故直连 localhost；服务进 VM 容器时改为 192.168.189.1（VMnet8 宿主地址）
    host: localhost
