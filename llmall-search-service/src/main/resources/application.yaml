server:
  port: 8093
# 关闭 ES 健康指标：ES 是可选加速件，engine=auto 时 ES 不可用会自动回落 MySQL 读模型。
# 【注意】不关闭时 ES 未启动会把聚合 /actuator/health 拉成 DOWN(503)，导致容器 healthcheck 永久失败、编排误判实例不可用。
management:
  health:
    elasticsearch:
      enabled: false
feign:
  okhttp:
    enabled: true
  sentinel:
    enabled: true
spring:
  cloud:
    sentinel:
      # eager 控制是否启动即向 Sentinel 控制台注册；false 为惰性注册，要等首次请求后控制台才看得到实例。
      # 【注意】不要改成 true：启动期即连控制台，控制台未启动时会因初始化 NPE 导致整个服务启动失败。
      eager: false
      transport:
        dashboard: ${llmall.sentinel.dashboard:localhost:8090}
      http-method-specify: true
llmall:
  swagger:
    title: "同城生活电商平台 · 搜索服务接口文档"
    package: com.llmall.search.controller
  db:
    database: llmall-search
  # 检索引擎开关：auto=优先 ES，失败回落 MySQL 读模型（默认）；es=只用 ES；mysql=只用 MySQL 读模型。
  search:
    engine: auto
    es:
      auto-create-index: true
      # function_score 参数：热度取对数(LOG1P) + 30 天高斯时间衰减 + 评分/评价数加成
      hot-score-factor: 1.0
      time-decay-scale: 30d
      score-boost: 0.5
      comments-boost: 0.3
  # 维护接口默认关闭；开启后仍需强服务令牌，不能只凭登录调用。
  maintenance:
    enabled: false
  # 服务间内部调用凭证：UserInfoInterceptor 仅在该请求头与本值完全一致时才采信 user-info 头。
  # 【注意】全项目所有服务必须配成同一个值，否则表现为"请求全部未登录"；生产应由网关注入或配置中心下发。
  internal:
    token: ${LLMALL_INTERNAL_TOKEN:llmall-internal-demo-token}
    service-token: ${LLMALL_SERVICE_TOKEN:}

# 接口文档：knife4j 4.x（openapi3），UI 地址 /doc.html，OpenAPI JSON /v3/api-docs。
knife4j:
  enable: true
  setting:
    language: zh_cn
springdoc:
  api-docs:
    path: /v3/api-docs
  # 扫描范围：本应用全部 controller，不必按包名逐个列举。
  group-configs:
    - group: default
      paths-to-match: '/**'
      packages-to-scan: com.llmall
