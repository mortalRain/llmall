server:
  port: 8089
feign:
  okhttp:
    enabled: true
  sentinel:
    enabled: true
spring:
  cloud:
    sentinel:
      # eager：默认惰性（false），要等第一次请求进来才向控制台注册，此前控制台里看不到实例属正常。
      # 【注意】不要再改成 true：eager=true 会在启动期就去连 Sentinel 控制台，控制台未启动（开发常态）
      # 时 SentinelAutoConfiguration 初始化 NPE，整个服务启动失败。
      eager: false
      transport:
        dashboard: ${llmall.sentinel.dashboard:localhost:8090}
      http-method-specify: true
llmall:
  swagger:
    title: "同城生活电商综合服务系统 · 内容社区服务接口文档"
    package: com.llmall.content.controller
  db:
    database: llmall-content
  # 服务间内部调用凭证：UserInfoInterceptor 仅在该头与本值完全一致时才采信 user-info 头
  # （服务监听 0.0.0.0，能收到该头不代表来自网关，直连端口可自行伪造）；由网关与 Feign 注入，网关剥离外部同名头。
  # 【注意】全项目所有服务必须同值，否则请求全部未登录；演示默认值仅用于本地，生产由网关注入或配置中心下发。
  internal:
    token: ${LLMALL_INTERNAL_TOKEN:llmall-internal-demo-token}

# 接口文档：knife4j 4.x 的 openapi3 分支（底层 springdoc-openapi）；UI 地址 /doc.html，OpenAPI JSON /v3/api-docs
knife4j:
  enable: true
  setting:
    language: zh_cn
springdoc:
  api-docs:
    path: /v3/api-docs
  # 直接扫本应用全部 controller（每个服务是一个独立限界上下文，不必按包名逐个列举）
  group-configs:
    - group: default
      paths-to-match: '/**'
      packages-to-scan: com.llmall
