<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>同城生活电商平台</title>
<!-- 设计系统集中在 theme.css（浅蓝钢蓝配色 + 门店域 + 商城域组件），单一来源便于统一改版。
     这里不再内联样式：之前 index.html 里留了一份旧的样式副本，导致 theme.css 里新增的组件
     （商品卡 / 订单卡 / 核销码 / 分类金刚区…）全都不生效，页面排版错乱——踩过这个坑。 -->
<link rel="stylesheet" href="theme.css" />
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="#/home">
      <span class="brand-mark">同</span>
      <span>同城生活<small>电商综合服务系统</small></span>
    </a>
    <nav class="nav" id="nav">
      <a href="#/home" data-nav="home">首页</a>
      <a href="#/mall?type=2" data-nav="mall">商城</a>
      <a href="#/nearby" data-nav="nearby">附近门店</a>
      <a href="#/orders" data-nav="orders">订单</a>
      <a href="#/cart" data-nav="cart" style="position:relative">购物车<span id="cartBadge" class="cart-badge" style="display:none">0</span></a>
      <a href="#/me" data-nav="me">我的</a>
    </nav>
    <div class="top-right">
      <span class="who" id="who"></span>
      <button class="btn btn-sm" id="apiBtn" title="设置后端地址">⚙ 接口</button>
      <a class="btn btn-sm btn-primary" href="#/login" id="loginBtn">登录</a>
    </div>
  </div>
</header>

<div class="wrap"><div id="view"></div></div>

<footer>
  <span>同城生活电商平台</span>
  <span>·</span>
  <span>Spring Cloud Alibaba 微服务架构</span>
  <span>·</span>
  <span id="apiShow"></span>
</footer>

<div id="toast"></div>

<script>
/* ============================================================================
 * 同城生活电商平台 · 演示前端
 * 纯原生 JS + fetch，零依赖、零构建 —— 双击本文件即可打开
 * 后端地址：默认 http://localhost:8080（网关），点右上角「⚙ 接口」可改
 * ========================================================================== */

const DEFAULT_API = 'http://localhost:8080';
function trimSlash(s) { s = String(s || ''); while (s.endsWith('/')) { s = s.slice(0, -1); } return s; }
const API = () => trimSlash(localStorage.getItem('tc_api') || DEFAULT_API);
const TOKEN = {
  get: () => localStorage.getItem('tc_token') || '',
  set: (t) => localStorage.setItem('tc_token', t || ''),
  clear: () => localStorage.removeItem('tc_token')
};
let ME = null;   // 当前登录用户

/* ---------------- 工具 ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', '': '&#39;' };
const h = (s) => String(s == null ? '' : s).split('').map((ch) => ESC[ch] || ch).join('');
const money = (fen) => { if (fen == null) { return '—'; } const s = (fen / 100).toFixed(2); return '¥' + (s.endsWith('.00') ? s.slice(0, -3) : s); };
const score10 = (s) => s == null ? '—' : (s / 10).toFixed(1);
const hot = (s) => s == null ? '—' : Number(s).toFixed(1);
const initial = (name) => (name || '同').trim().charAt(0);

function toast(msg, ms = 2400) {
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  $('#toast').appendChild(el);
  setTimeout(() => el.remove(), ms);
}

async function api(path, { method = 'GET', body, auth = false } = {}) {
  const headers = {};
  if (body) headers['content-type'] = 'application/json';
  if (auth || TOKEN.get()) { const t = TOKEN.get(); if (t) headers['authorization'] = t; }
  let res;
  try {
    res = await fetch(API() + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
  } catch (e) {
    throw new Error('连接不上后端（' + API() + '），请确认网关与相关服务已启动');
  }
  if (res.status === 401) { TOKEN.clear(); ME = null; paintWho(); throw new Error('登录已过期，请重新登录'); }
  if (!res.ok) {
    let msg = 'HTTP ' + res.status;
    try { const j = await res.json(); if (j && j.msg) msg = j.msg; } catch (e) { }
    throw new Error(msg);
  }
  const ct = res.headers.get('content-type') || '';
  if (ct.includes('json')) return res.json();
  const txt = await res.text();
  return txt === '' ? null : txt;
}

/* ---------------- 公共片段 ---------------- */
function thumb(it) {
  // 课程数据里的图片多为外链，可能失效 —— 用 onerror 回退为「首字渐变块」
  return `<div class="thumb">
    ${it.images ? `<img src="${h(String(it.images).split(',')[0])}" alt="" loading="lazy"
        onerror="this.style.display='none';this.parentNode.insertAdjacentHTML('beforeend','<span class=\\'ph\\'>${h(initial(it.name))}</span>')">` : `<span class="ph">${h(initial(it.name))}</span>`}
    ${it.typeName ? `<span class="tag">${h(it.typeName)}</span>` : ''}
    <span class="tag hot">🔥 ${hot(it.hotScore)}</span>
  </div>`;
}

function shopCard(s) {
  const p = Math.max(0, Math.min(100, (s.score || 0) / 50 * 100));
  return `<article class="card" onclick="location.hash='#/shop/${s.id}'">
    ${thumb(s)}
    <div class="card-b">
      <h3>${h(s.name)}</h3>
      <div class="meta">
        <span class="score">${score10(s.score)}</span>
        <span class="stars" style="--p:${p}%">★★★★★</span>
        <span class="dot"></span>
        <span>${s.comments ?? 0} 条评价</span>
      </div>
      <div class="meta">
        <span>${h(s.area || '—')}</span><span class="dot"></span>
        <span>人均 ${money(s.avgPrice)}</span>
        ${s.distance != null ? `<span class="dot"></span><span>${Number(s.distance).toFixed(2)} km</span>` : ''}
      </div>
    </div>
  </article>`;
}

function skeletons(n = 6) {
  return `<div class="grid">` + Array.from({ length: n }).map(() =>
    `<div class="card"><div class="sk" style="aspect-ratio:16/10"></div>
     <div class="card-b"><div class="sk" style="height:16px;width:80%"></div>
     <div class="sk" style="height:12px;width:55%;margin-top:8px"></div></div></div>`).join('') + `</div>`;
}

async function loadRank(limit = 8) {
  try {
    const list = await api(`/shops/hot?limit=${limit}`);
    if (!list || !list.length) return `<div class="empty">榜单暂无数据<br><small>登录后调用一次 /shops/cache/geo/rebuild 可初始化</small></div>`;
    return `<ul class="rank">` + list.map((s, i) =>
      `<li onclick="location.hash='#/shop/${s.id}'">
         <span class="rk ${i < 3 ? 'g' + (i + 1) : ''}">${i + 1}</span>
         <span class="nm">${h(s.name)}</span>
         <span class="ht">${hot(s.hotScore)}</span>
       </li>`).join('') + `</ul>`;
  } catch (e) {
    return `<div class="empty">榜单加载失败<br><small>${h(e.message)}</small></div>`;
  }
}

function paintWho() {
  $('#who').textContent = ME ? (ME.nickName || ME.username || '') + (ME.credits != null ? ` · ${ME.credits} 积分` : '') : '';
  $('#loginBtn').style.display = ME ? 'none' : '';
  $('#loginBtn').href = '#/login';
}
async function refreshMe() {
  if (!TOKEN.get()) { ME = null; paintWho(); return; }
  try { ME = await api('/users/me', { auth: true }); } catch (e) { ME = null; }
  paintWho();
}

/* ---------------- 视图：首页 ---------------- */
async function renderHome(keyword) {
  const v = $('#view');
  v.innerHTML = `
    <section class="hero hero-sm">
      <h1>同城生活电商平台</h1>
      <p>逛门店 · 买套餐 · 下单到店 · 写评价 —— 评价实时影响门店热度与榜单排序</p>
      <form class="searchbar" onsubmit="return doSearch(event)">
        <input id="kw" placeholder="搜索门店名称 / 商圈 / 地址，如：烧烤、拱墅" value="${h(keyword || '')}" />
        <button class="btn btn-primary" type="submit">搜索</button>
        <a class="btn" href="#/mall?type=2" style="white-space:nowrap">🛍️ 逛商城</a>
      </form>
      <div class="chips" id="chips"></div>
      <div class="hero-stats" id="homeStats"></div>
    </section>

    <div class="sec-head" style="margin-top:18px"><h2>按品类逛</h2><span>门店类型 → 一键筛选</span></div>
    <div class="cat-tiles" id="homeTiles"></div>

    <div class="sec-head"><h2>热销套餐</h2><span>llmall-item-service · 门店套餐与团购券（按销量）</span>
      <span class="link-more" style="margin-left:auto" onclick="location.hash='#/mall?type=2'">全部套餐 ›</span></div>
    <div id="hotItems">${skeletons(5)}</div>
    <div class="sec-head"><h2>精选实物商品</h2><span>合并原商城工程的实物商品域</span>
      <span class="link-more" style="margin-left:auto" onclick="location.hash='#/mall?type=1'">全部商品 ›</span></div>
    <div id="hotGoods">${skeletons(4)}</div>
    <div class="layout">
      <div>
        <div class="sec-head"><h2 id="listTitle">门店推荐</h2><span id="listSub">按热度分排序</span></div>
        <div id="list">${skeletons()}</div>
      </div>
      <aside class="aside">
        <div class="panel">
          <div class="panel-h"><span class="fire">🔥</span> 门店热度榜 <span style="margin-left:auto;font-size:12px;color:var(--muted)">Redis ZSet</span></div>
          <div id="rank"><div class="empty">加载中…</div></div>
        </div>
      </aside>
    </div>`;

  // 门店类型 chips + 品类金刚区
  try {
    const types = await api('/shop-types');
    const list = types || [];
    $('#chips').innerHTML = list.slice(0, 8).map(t =>
      `<span class="chip" onclick="doSearch(null,'${h(t.name)}')">${h(t.name)}</span>`).join('');
    const ICONS = { '美食': '🍜', 'KTV': '🎤', '丽人·美发': '💇', '健身运动': '🏋️', '按摩·足疗': '💆', '美容SPA': '💅', '亲子游乐': '🧸', '酒吧': '🍸', '轰趴馆': '🎉', '美睫·美甲': '💅' };
    $('#homeTiles').innerHTML = list.map(t =>
      `<div class="cat-tile" onclick="doSearch(null,'${h(t.name)}')">
         <i>${ICONS[t.name] || '🏬'}</i><div class="t">${h(t.name)}</div><div class="c">逛一逛</div></div>`).join('');
  } catch (e) { /* 类型加载失败不影响主流程 */ }

  // 顶部数据条 + 商城热销（到店套餐 / 实物商品）
  try {
    const [pkg, goods] = await Promise.all([
      api('/items/page?pageNo=1&pageSize=10&type=2&sortBy=sold&isAsc=false'),
      api('/items/page?pageNo=1&pageSize=10&type=1&sortBy=sold&isAsc=false')
    ]);
    $('#homeStats').innerHTML = `
      <div class="hs"><b>${pkg.total ?? 0}</b><span>个到店套餐</span></div>
      <div class="hs"><b>${goods.total ?? 0}</b><span>件精选商品</span></div>
      <div class="hs"><b>14</b><span>家合作门店</span></div>
      <div class="hs"><b>核销 · 评价 · 热度</b><span>完整闭环</span></div>`;
    $('#hotItems').innerHTML = (pkg.list || []).length
      ? `<div class="mall-grid wide">${pkg.list.map(itemCard).join('')}</div>`
      : `<div class="empty">暂无套餐</div>`;
    $('#hotGoods').innerHTML = (goods.list || []).length
      ? `<div class="mall-grid wide">${goods.list.map(itemCard).join('')}</div>`
      : `<div class="empty">暂无商品</div>`;
  } catch (e) {
    $('#hotItems').innerHTML = `<div class="alert warn">商品加载失败：${h(e.message)}</div>`;
    $('#hotGoods').innerHTML = '';
  }

  const path = keyword ? `/search?keyword=${encodeURIComponent(keyword)}&page=1&size=12`
                       : `/shops/page?page=1&size=12`;
  try {
    const data = await api(path);
    const list = data.list || [];
    $('#listTitle').textContent = keyword ? `搜索「${keyword}」` : '门店推荐';
    $('#listSub').textContent = `共 ${data.total ?? list.length} 家`;
    $('#list').innerHTML = list.length ? `<div class="grid">${list.map(shopCard).join('')}</div>`
      : `<div class="empty"><div class="big">🔍</div>没有找到相关门店</div>`;
  } catch (e) {
    $('#list').innerHTML = `<div class="alert warn">数据加载失败：${h(e.message)}</div>`;
  }
  $('#rank').innerHTML = await loadRank(8);
  markNav('home');
}

function doSearch(ev, kw) {
  if (ev && ev.preventDefault) ev.preventDefault();
  const k = kw || ($('#kw') ? $('#kw').value.trim() : '');
  location.hash = k ? '#/home/' + encodeURIComponent(k) : '#/home';
  return false;
}

/* ---------------- 视图：附近门店（Redis GEO） ---------------- */
async function renderNearby() {
  const v = $('#view');
  v.innerHTML = `<div class="sec-head"><h2>附近门店</h2><span>基于 Redis GEO，中心点：杭州 120.1519, 30.3100（可改 SOURCE）</span></div>
    <div class="alert warn" style="display:none" id="geoHint"></div>
    <div id="list">${skeletons(4)}</div>`;
  try {
    const list = await api('/shops/nearby?x=120.1519&y=30.3100&radius=20&limit=12');
    if (!list || !list.length) {
      $('#list').innerHTML = `<div class="empty"><div class="big">📍</div>附近没有门店<br>
        <small>GEO 索引可能未构建：登录后调用一次 <code>POST /shops/cache/geo/rebuild</code></small></div>`;
      return;
    }
    $('#list').innerHTML = `<div class="grid">${list.map(shopCard).join('')}</div>`;
  } catch (e) {
    $('#list').innerHTML = `<div class="alert warn">加载失败：${h(e.message)}</div>`;
  }
  markNav('nearby');
}

/* ---------------- 视图：门店详情 + 评价 ---------------- */
async function renderShop(id) {
  const v = $('#view');
  v.innerHTML = `<div class="sk" style="height:190px;border-radius:16px"></div>
                 <div class="sec-head"><h2>加载中…</h2></div>`;
  let shop;
  try { shop = await api('/shops/' + id); }
  catch (e) { v.innerHTML = `<div class="alert warn">门店加载失败：${h(e.message)}</div>`; return; }

  const p = Math.max(0, Math.min(100, (shop.score || 0) / 50 * 100));
  v.innerHTML = `
    <div class="detail-head fade">
      <div class="pic">${shop.images
        ? `<img src="${h(String(shop.images).split(',')[0])}" alt="" onerror="this.style.display='none';this.parentNode.insertAdjacentHTML('beforeend','<span class=\\'ph\\'>${h(initial(shop.name))}</span>')">`
        : `<span class="ph">${h(initial(shop.name))}</span>`}</div>
      <div>
        <h1>${h(shop.name)}</h1>
        <div class="meta">
          <span class="score" style="font-size:16px">${score10(shop.score)}</span>
          <span class="stars" style="--p:${p}%">★★★★★</span>
          <span class="dot"></span><span>${shop.comments ?? 0} 条评价</span>
          <span class="dot"></span><span>🔥 热度 ${hot(shop.hotScore)}</span>
        </div>
        <div class="kv">
          <span>📍 <b>${h(shop.address || '—')}</b></span>
          ${shop.area ? `<span>商圈：${h(shop.area)}</span>` : ''}
          ${shop.avgPrice ? `<span>人均：<b class="price">${money(shop.avgPrice)}</b></span>` : ''}
          ${shop.openHours ? `<span>营业：${h(shop.openHours)}</span>` : ''}
        </div>
        <div class="stat-row">
          <div class="stat"><div class="v">${shop.sold ?? 0}</div><div class="k">销量</div></div>
          <div class="stat"><div class="v">${shop.comments ?? 0}</div><div class="k">评价数</div></div>
          <div class="stat"><div class="v">${hot(shop.hotScore)}</div><div class="k">热度分</div></div>
        </div>
      </div>
    </div>

    <div class="layout" style="margin-top:22px">
      <div>
        <div class="sec-head"><h2>门店套餐</h2><span>商品域 · 共 <b id="pkgCount">0</b> 个</span></div>
        <div id="items">${skeletons(2)}</div>

        <div class="sec-head"><h2>用户评价</h2><span>发布后经 MQ 异步聚合，会改变门店热度与榜单</span></div>
        <div id="reviews"><div class="sk" style="height:60px"></div></div>
      </div>
      <aside class="aside">
        <div class="panel" style="margin-bottom:16px">
          <div class="panel-h">✍️ 发布评价</div>
          <div style="padding:14px">
            <div class="field"><label>评分</label>
              <div class="rate" id="rate">${[1,2,3,4,5].map(i => `<i data-v="${i}" onclick="setRate(${i})">★</i>`).join('')}</div>
            </div>
            <div class="field"><label>标题</label><input class="input" id="rvTitle" placeholder="一句话总结，如：好吃到爆" /></div>
            <div class="field"><label>正文</label><textarea class="input" id="rvContent" rows="3" placeholder="说说你的体验…"></textarea></div>
            <button class="btn btn-primary" style="width:100%" onclick="submitReview(${id})">提交评价</button>
            <div style="font-size:12px;color:var(--muted);margin-top:8px">※ 提交后 1~3 秒内，右侧“门店热度榜”会发生变化</div>
          </div>
        </div>
        <div class="panel">
          <div class="panel-h"><span class="fire">🔥</span> 门店热度榜</div>
          <div id="rank"><div class="empty">加载中…</div></div>
        </div>
      </aside>
    </div>`;

  selRate = 5; paintRate();

  // 套餐：用紧凑卡片网格（一行 3~4 个），不再一行一个浪费右半边
  try {
    const items = await api('/items/shop/' + id);
    $('#pkgCount') && ($('#pkgCount').textContent = (items || []).length);
    $('#items').innerHTML = (items && items.length)
      ? `<div class="pkg-grid">${items.map(pkgCard).join('')}</div>`
      : `<div class="empty">该门店暂无套餐<br><small>可执行 sql/merged/50-seed-local-life-data.sql 生成演示套餐</small></div>`;
  } catch (e) { $('#items').innerHTML = `<div class="empty">套餐加载失败：${h(e.message)}</div>`; }

  // 评价
  try {
    const rv = await api(`/blogs/shop/${id}?page=1&size=5`);
    const list = (rv && rv.list) || [];
    $('#reviews').innerHTML = list.length ? list.map(b => `
      <div class="review">
        <div class="top">
          <span class="avatar">${h(initial('用户' + b.userId))}</span>
          <b style="color:var(--ink)">用户 ${h(b.userId)}</b>
          <span class="stars" style="--p:${Math.max(0, Math.min(100, (b.score || 0) / 5 * 100))}%">★★★★★</span>
          <span style="margin-left:auto">${h((b.createTime || '').replace('T', ' ').slice(0, 16))}</span>
        </div>
        <div style="margin-top:6px;font-weight:600">${h(b.title)}</div>
        <div style="color:var(--ink-2);font-size:13.5px;margin-top:2px">${h(b.content)}</div>
      </div>`).join('') : `<div class="empty">还没有评价，来写第一条吧 👆</div>`;
  } catch (e) { $('#reviews').innerHTML = `<div class="empty">评价加载失败</div>`; }

  $('#rank').innerHTML = await loadRank(8);
  markNav('');
}

let selRate = 5;
function setRate(n) { selRate = n; paintRate(); }
function paintRate() {
  document.querySelectorAll('#rate i').forEach(el => el.classList.toggle('on', Number(el.dataset.v) <= selRate));
}
async function submitReview(shopId) {
  if (!TOKEN.get()) { toast('请先登录'); location.hash = '#/login'; return; }
  const title = $('#rvTitle').value.trim(), content = $('#rvContent').value.trim();
  if (!title || !content) { toast('标题和正文都要填哦'); return; }
  try {
    await api('/blogs', { method: 'POST', auth: true, body: { shopId: Number(shopId), title, content, score: selRate } });
    toast('评价已提交，正在异步聚合热度…');
    // 门店域消费 review.created 后会重算热度并投递 shop.hot.changed
    setTimeout(async () => {
      const before = $('#rank') ? $('#rank').innerText : '';
      $('#rank').innerHTML = await loadRank(8);
      const after = $('#rank').innerText;
      if (before && before !== after) toast('🔥 榜单已更新！热度分变化可见');
      const s = await api('/shops/' + shopId).catch(() => null);
      if (s) {
        const st = document.querySelector('.stat-row');
        if (st) st.innerHTML = `<div class="stat"><div class="v">${s.sold ?? 0}</div><div class="k">销量</div></div>
          <div class="stat"><div class="v">${s.comments ?? 0}</div><div class="k">评价数</div></div>
          <div class="stat"><div class="v">${hot(s.hotScore)}</div><div class="k">热度分</div></div>`;
      }
    }, 2000);
  } catch (e) { toast('提交失败：' + e.message); }
}

/* ---------------- 视图：登录 ---------------- */
async function renderLogin() {
  const v = $('#view');
  v.innerHTML = `
    <div style="max-width:430px;margin:34px auto">

function isPhone(p) {
  if (typeof p !== 'string' || p.length !== 11 || p[0] !== '1') { return false; }
  if ('3456789'.indexOf(p[1]) < 0) { return false; }
  for (var i = 2; i < p.length; i++) { if (p[i] < '0' || p[i] > '9') { return false; } }
  return true;
}

function parseQuery(qs) {
  const q = {};
  String(qs || '').split('&').forEach(kv => {
    if (!kv) return;
    const i = kv.indexOf('=');
    const k = i < 0 ? kv : kv.slice(0, i);
    const v = i < 0 ? '' : decodeURIComponent(kv.slice(i + 1));
    q[k] = v;
  });
  return q;
}

function pagerHtml(pageNo, pages, makeHash) {
  if (!pages || pages <= 1) return '';
  const btn = (p, label, on) => `<button ${on ? 'class="on"' : ''} ${p < 1 || p > pages ? 'disabled' : ''}
    onclick="location.hash='${makeHash(p)}'">${label}</button>`;
  let html = btn(pageNo - 1, '上一页', false);
  const from = Math.max(1, Math.min(pageNo - 3, pages - 6));
  const to = Math.min(pages, from + 6);
  for (let p = from; p <= to; p++) html += btn(p, p, p === pageNo);
  html += btn(pageNo + 1, '下一页', false);
  return `<div class="pager">${html}<span class="pg-info">第 ${pageNo} / ${pages} 页</span></div>`;
}

/* ---------------- 支付 ---------------- */
let PAY_CTX = null;
async function renderPay(orderId) {
  const v = $('#view');
  if (!ensureLogin()) { v.innerHTML = ''; return; }
  v.innerHTML = `<div id="payBox">${skeletons(2)}</div>`;
  markNav('');
  let order;
  try { order = await api('/orders/' + orderId, { auth: true }); }
  catch (e) { $('#payBox').innerHTML = `<div class="alert warn">订单加载失败：${h(e.message)}</div>`; return; }
  if (order.status !== 1) {
    toast('该订单不是待支付状态');
    location.hash = '#/order/' + orderId; return;
  }
  let me = null;
  try { me = await api('/users/me', { auth: true }); } catch (e) { }
  // 生成（或复用）支付单：applyPayOrder 对同一 bizOrderNo 幂等，重复点不会重复建单
  let payOrderId = '';
  try {
    payOrderId = await api('/pay-orders', {
      method: 'POST', auth: true,
      body: {
        // 【关键】不能写 Number(order.id)：订单 id 是 19 位雪花号，JS 的 Number 超过 2^53 会丢精度，
        // 存进支付单的 bizOrderNo 会变成"被四舍五入的错 id"，于是支付成功后按 id 找不到订单
        // （表现为订单一直停在"待付款"），加了支付前校验后则直接报"订单不存在/支付失败"。
        // 后端 Jackson 能把数字字符串绑定到 Long，所以原样传字符串即可。
        bizOrderNo: order.id, amount: order.totalFee, payChannelCode: 'balance',
        // 注意两个枚举不是同一套：订单侧 paymentType=3 表示"扣减余额"，
        // 而支付侧 PayType.BALANCE=5（1 JSAPI/2 小程序/3 APP/4 扫码/5 余额），写 3 会被 llmall-pay-service 拒绝
        payType: 5, orderInfo: (order.details || []).map(d => `${d.name}×${d.num}`).join(';')
      }
    });
  } catch (e) { toast('生成支付单失败：' + e.message); }
  PAY_CTX = { orderId: order.id, payOrderId: payOrderId };

  $('#payBox').innerHTML = `
    <div class="steps" style="justify-content:center">
      <span class="st"><b>1</b>确认订单</span><span class="arw">›</span>
      <span class="st on"><b>2</b>余额支付</span><span class="arw">›</span>
      <span class="st"><b>3</b>到店核销</span>
    </div>
    <div class="paybox fade">
      <div style="text-align:center;color:var(--muted);font-size:13px">订单 ${h(String(order.id))}</div>
      <div class="amount">${money(order.totalFee)}</div>
      <div style="text-align:center;font-size:12.5px;color:var(--muted)">${(order.details || []).map(d => h(d.name) + '×' + d.num).join('、')}</div>
      <div class="way">
        <span style="font-size:20px">💳</span>
        <div style="flex:1">
          <div style="font-weight:600">余额支付</div>
          <div style="font-size:12.5px;color:var(--muted)">当前余额 ${me ? money(me.balance) : '—'} · 支付后由 order.paid 事件异步发放积分</div>
        </div>
        <span style="color:var(--brand-600)">✓</span>
      </div>
      <div class="field"><label>支付密码（演示环境与登录密码一致：123456）</label>
        <input class="input" id="payPw" type="password" value="123456" /></div>
      <button class="btn btn-primary" style="width:100%;justify-content:center" id="payBtn" onclick="doPay()">确认支付</button>
      <div style="text-align:center;margin-top:12px">
        <span class="link-more" onclick="location.hash='#/order/${order.id}'">稍后再付，查看订单</span>
      </div>
      <div style="font-size:12px;color:var(--muted);margin-top:12px;text-align:center">
        支付链路：llmall-pay-service 校验支付单状态 → Feign 调 llmall-user-service 扣余额 → 改支付单状态 → 发 pay.success → llmall-trade-service 改订单状态并发 order.paid
      </div>
    </div>`;
}
async function doPay() {
  if (!PAY_CTX || !PAY_CTX.payOrderId) { toast('支付单未就绪，请返回订单页重试'); return; }
  const btn = $('#payBtn');
  btn.disabled = true; btn.textContent = '支付中…';
  try {
    await api('/pay-orders/' + PAY_CTX.payOrderId, {
      // 支付单 id 同样是雪花号：走路径传字符串，body 里不要再 Number() 一遍（服务端会以路径为准）
      method: 'POST', auth: true, body: { pw: $('#payPw').value }
    });
    // 订单状态是「llmall-pay-service 发 MQ → llmall-trade-service 异步改」的，付完立刻跳转会看到"待付款"，
    // 用户会以为没付成功。这里轮询几次，等状态真的变了再跳。
    btn.textContent = '支付成功，状态同步中…';
    const orderId = PAY_CTX.orderId;
    let status = 1;
    for (let i = 0; i < 8; i++) {
      await new Promise(r => setTimeout(r, 700));
      try {
        const o = await api('/orders/' + orderId, { auth: true });
        status = Number(o.status);
        if (status !== 1) { break; }
      } catch (e) { /* 轮询失败就继续重试 */ }
    }
    toast(status === 2 || status === 7
      ? '支付成功 🎉 积分与门店销量正在异步到账'
      : '支付已完成，状态同步中；进入订单页稍等即可看到"待使用"');
    location.hash = '#/order/' + orderId;
  } catch (e) {
    toast('支付失败：' + e.message);
    btn.disabled = false; btn.textContent = '确认支付';
  }
}

/* ---------------- 我的订单 ---------------- */
const ORDER_TABS = [
  { k: '', n: '全部' }, { k: '1', n: '待付款' }, { k: '2', n: '待使用' },
  { k: '7', n: '已完成' }, { k: '5', n: '已取消' }
];
function orderStatusMeta(s) {
  if (s === 1) return ['s1', '待付款', '请在 10 秒内完成支付，超时自动关单'];
  if (s === 2) return ['s2', '待使用', '到店出示核销码即可消费'];
  if (s === 7) return ['s7', '已完成', '本次消费已完成核销'];
  if (s === 5) return ['s5', '已取消', '订单已关闭，库存已回滚'];
  return ['s5', '状态 ' + s, ''];
}
function orderCard(o) {
  const [cls, txt] = orderStatusMeta(o.status);
  const first = (o.details || [])[0] || {};
  const totalNum = (o.details || []).reduce((s, d) => s + (d.num || 0), 0);
  return `<div class="ocard fade">
    <div class="ocard-h">
      <span>订单号 ${h(String(o.id))}</span>
      <span class="dot"></span>
      <span>${h((o.createTime || '').replace('T', ' ').slice(0, 16))}</span>
      <span class="ob ${cls}" style="margin-left:auto">${txt}</span>
    </div>
    <div class="ocard-b" style="cursor:pointer" onclick="location.hash='#/order/${o.id}'">
      <div class="ov">${first.image ? `<img src="${h(first.image)}" onerror="this.remove()" alt="">` : catStyle('')[0]}</div>
      <div style="flex:1;min-width:0">
        <div style="font-size:14.5px;font-weight:600">${h(first.name || '订单商品')}${(o.details || []).length > 1 ? ` 等 ${o.details.length} 件` : (totalNum > 1 ? ' ×' + totalNum : '')}</div>
        <div class="meta"><span>${o.orderType === 2 ? '门店套餐' : '实物商品'}</span>
          ${o.shopId ? `<span class="dot"></span><span>门店 #${o.shopId}</span>` : ''}
          ${o.verifyCode ? `<span class="dot"></span><span>核销码 ${h(o.verifyCode)}</span>` : ''}</div>
      </div>
      <div style="text-align:right">
        <div class="price" style="font-size:16px">${money(o.totalFee)}</div>
        <div style="font-size:12px;color:var(--muted)">共 ${totalNum} 件</div>
      </div>
    </div>
    <div class="ocard-f">
      <span style="font-size:12.5px;color:var(--muted)">${orderStatusMeta(o.status)[2]}</span>
      <span style="margin-left:auto;display:flex;gap:8px">
        ${o.status === 1 ? `<button class="btn btn-sm" onclick="cancelMyOrder(${o.id})">取消订单</button>
                            <button class="btn btn-sm btn-primary" onclick="location.hash='#/pay/${o.id}'">去支付</button>` : ''}
        ${o.status === 2 || o.status === 7 ? `<button class="btn btn-sm" onclick="location.hash='#/order/${o.id}'">查看核销码</button>` : ''}
        ${o.status === 5 ? `<button class="btn btn-sm" onclick="location.hash='#/mall'">再逛逛</button>` : ''}
      </span>
    </div>
  </div>`;
}
async function renderOrders(q) {
  const v = $('#view');
  if (!ensureLogin()) { v.innerHTML = ''; return; }
  const status = q.status || '', p = Math.max(1, Number(q.p || 1));
  v.innerHTML = `
    <div class="sec-head"><h2>我的订单</h2><span>llmall-trade-service /orders（按登录用户过滤，含明细）</span></div>
    <div class="tabs">
      ${ORDER_TABS.map(t => `<button class="${t.k === status ? 'on' : ''}"
        onclick="location.hash='#/orders${t.k ? '?status=' + t.k : ''}'">${t.n}</button>`).join('')}
    </div>
    <div id="orderList">${skeletons(3)}</div>
    <div id="orderPager"></div>`;
  markNav('orders');
  try {
    const data = await api(`/orders?pageNo=${p}&pageSize=5${status ? '&status=' + status : ''}`, { auth: true });
    const list = data.list || [];
    $('#orderList').innerHTML = list.length ? list.map(orderCard).join('')
      : `<div class="empty"><div class="big">📦</div>还没有订单<br><br><a class="btn btn-primary" href="#/mall">去商城下单</a></div>`;
    const mk = (np) => `#/orders?${status ? 'status=' + status + '&' : ''}p=${np}`;
    $('#orderPager').innerHTML = pagerHtml(p, data.pages || 1, mk);
  } catch (e) {
    $('#orderList').innerHTML = `<div class="alert warn">订单加载失败：${h(e.message)}</div>`;
  }
}
async function cancelMyOrder(id) {
  if (!confirm('确认取消该订单？取消后库存会自动回滚。')) return;
  try { await api('/orders/' + id + '/cancel', { method: 'PUT', auth: true }); toast('订单已取消，库存已回滚'); renderOrders(parseQuery(location.hash.split('?')[1] || '')); }
  catch (e) { toast('取消失败：' + e.message); }
}
async function renderOrder(id) {
  const v = $('#view');
  if (!ensureLogin()) { v.innerHTML = ''; return; }
  v.innerHTML = `<div id="odBox">${skeletons(2)}</div>`;
  markNav('orders');
  let o;
  try { o = await api('/orders/' + id, { auth: true }); }
  catch (e) { $('#odBox').innerHTML = `<div class="alert warn">订单加载失败：${h(e.message)}</div>`; return; }
  const [cls, txt, tip] = orderStatusMeta(o.status);
  // 待付款的订单可能刚支付完、状态还在异步同步中：自动刷新几次，避免用户看到旧状态
  if (o.status === 1 && (window.__orderPoll = (window.__orderPoll || 0) + 1) <= 3) {
    setTimeout(() => { if (location.hash.indexOf('#/order/' + id) === 0) { renderOrder(id); } }, 2500);
  } else if (o.status !== 1) {
    window.__orderPoll = 0;
  }
  let shop = null;
  if (o.shopId) { try { shop = await api('/shops/' + o.shopId); } catch (e) { } }
  const totalNum = (o.details || []).reduce((s, d) => s + (d.num || 0), 0);
  $('#odBox').innerHTML = `
    <div class="sec-head" style="margin-top:0">
      <h2>订单详情</h2>
      <span class="ob ${cls}">${txt}</span>
      <span class="link-more" style="margin-left:auto" onclick="location.hash='#/orders'">返回订单列表</span>
    </div>
    <div class="layout">
      <div>
        ${(o.status === 2 || o.status === 7) && o.verifyCode ? `
          <div class="verify" style="margin-bottom:16px">
            <div class="lbl">到店核销码</div>
            <div class="code">${h(o.verifyCode)}</div>
            <div class="tip">${o.status === 7 ? '已于 ' + h((o.verifyTime || '').replace('T', ' ').slice(0, 16)) + ' 核销' : '请向门店店员出示此码'}</div>
          </div>` : ''}
        <div class="panel" style="margin-bottom:16px">
          <div class="panel-h">商品明细</div>
          <div style="padding:14px">
            ${(o.details || []).map(d => `
              <div class="crow" style="margin-bottom:10px">
                <div class="cv" style="background:${catStyle('')[1]}">${d.image ? `<img src="${h(d.image)}" onerror="this.remove()" alt="">` : catStyle('')[0]}</div>
                <div class="cinfo"><h4>${h(d.name)}</h4>
                  <div class="meta"><span class="price">${money(d.price)}</span><span class="dot"></span><span>× ${d.num}</span>
                  ${d.spec ? `<span class="dot"></span><span>${h(d.spec)}</span>` : ''}</div>
                </div>
                <div class="cright"><span class="price">${money((d.price || 0) * (d.num || 0))}</span>
                  <span class="link-more" onclick="location.hash='#/item/${d.itemId}'">再看一眼</span></div>
              </div>`).join('')}
          </div>
        </div>
        <div class="panel">
          <div class="panel-h">订单信息</div>
          <div style="padding:14px">
            <div class="sum-row"><span>订单号</span><span class="v">${h(String(o.id))}</span></div>
            <div class="sum-row"><span>订单类型</span><span class="v">${o.orderType === 2 ? '门店套餐/团购券' : '实物商品'}</span></div>
            ${shop ? `<div class="sum-row"><span>门店</span><span class="v link-more" onclick="location.hash='#/shop/${shop.id}'">${h(shop.name)}</span></div>` : ''}
            <div class="sum-row"><span>支付方式</span><span class="v">${o.paymentType === 3 ? '余额支付' : '在线支付'}</span></div>
            <div class="sum-row"><span>创建时间</span><span class="v">${h((o.createTime || '').replace('T', ' ').slice(0, 19))}</span></div>
            ${o.payTime ? `<div class="sum-row"><span>支付时间</span><span class="v">${h((o.payTime || '').replace('T', ' ').slice(0, 19))}</span></div>` : ''}
            ${o.closeTime ? `<div class="sum-row"><span>关闭时间</span><span class="v">${h((o.closeTime || '').replace('T', ' ').slice(0, 19))}</span></div>` : ''}
            <div class="sum-row"><span>状态说明</span><span class="v">${tip}</span></div>
          </div>
        </div>
      </div>
      <aside class="aside">
        <div class="panel summary">
          <div class="panel-h">金额</div>
          <div style="padding:16px">
            <div class="sum-row"><span>商品件数</span><span class="v">${totalNum} 件</span></div>
            <div class="sum-total"><span>实付</span><span class="v">${money(o.totalFee)}</span></div>
            ${o.status === 1 ? `<button class="btn btn-primary" style="width:100%;margin-top:16px;justify-content:center"
                 onclick="location.hash='#/pay/${o.id}'">立即支付</button>
              <button class="btn btn-sm" style="width:100%;margin-top:8px;justify-content:center" onclick="cancelMyOrder(${o.id})">取消订单</button>` : ''}
            ${o.status === 2 ? `<div class="alert ok" style="margin:14px 0 0">已支付，可到店消费；核销后门店销量与热度会更新</div>` : ''}
          </div>
        </div>
      </aside>
    </div>`;
}

/* ---------------- 收货地址 ---------------- */

  const v = $('#view');
  if (!ensureLogin()) { v.innerHTML = ''; return; }
  v.innerHTML = `<div class="sec-head"><h2>收货地址</h2><span>llmall-user-service /addresses（写入时 userId 只取网关透传身份）</span></div>
    <div id="addrBox">${skeletons(2)}</div>`;
  markNav('me');
  let list = [];
  try { list = await api('/addresses', { auth: true }) || []; } catch (e) { }
  $('#addrBox').innerHTML = `
    <div class="layout">
      <div>
        ${list.length ? list.map(a => `
          <div class="addr">
            <span style="font-size:17px">📍</span>
            <div style="flex:1;min-width:0">
              <div><b>${h(a.contact || '')}</b> ${h(a.mobile || '')}${a.isDefault === 1 ? '<span class="tagd">默认</span>' : ''}</div>
              <div style="font-size:13px;color:var(--muted)">${h((a.province || '') + (a.city || '') + (a.town || '') + (a.street || ''))}</div>
            </div>
            <span class="link-more" onclick="deleteAddress(${a.id})">删除</span>
          </div>`).join('') : `<div class="empty"><div class="big">📍</div>还没有收货地址</div>`}
      </div>
      <aside class="aside">
        <div class="form">
          <div style="font-weight:600;margin-bottom:10px">新增地址</div>
          <div class="field"><label>联系人</label><input class="input" id="adContact" placeholder="姓名" /></div>
          <div class="field"><label>手机号</label><input class="input" id="adMobile" placeholder="11 位手机号" /></div>
          <div class="field"><label>省 / 市 / 区</label>
            <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
              <input class="input" id="adProvince" value="浙江省" /><input class="input" id="adCity" value="杭州市" /><input class="input" id="adTown" value="西湖区" />
            </div></div>
          <div class="field"><label>详细地址</label><input class="input" id="adStreet" placeholder="街道门牌" /></div>
          <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);margin-bottom:12px">
            <input type="checkbox" id="adDefault" /> 设为默认地址</label>
          <button class="btn btn-primary" style="width:100%;justify-content:center" onclick="saveAddress()">保存</button>
        </div>
      </aside>
    </div>`;
}
async function saveAddress(backToCheckout) {
  const body = {
    contact: ($('#adContact') || {}).value || '',
    mobile: ($('#adMobile') || {}).value || '',
    province: ($('#adProvince') || {}).value || '',
    city: ($('#adCity') || {}).value || '',
    town: ($('#adTown') || {}).value || '',
    street: ($('#adStreet') || {}).value || '',
    isDefault: ($('#adDefault') && $('#adDefault').checked) ? 1 : 0
  };
  if (!body.contact || !body.mobile || !body.street) { toast('联系人、手机号、详细地址都要填'); return; }
  try {
    const id = await api('/addresses', { method: 'POST', auth: true, body });
    toast('地址已保存');
    if (backToCheckout) { CHECKOUT.addressId = id; renderCheckout({ src: parseQuery(location.hash.split('?')[1] || '').src || 'cart' }); }
    else renderAddress();
  } catch (e) { toast('保存失败：' + e.message); }
}
async function deleteAddress(id) {
  if (!confirm('确认删除该地址？')) return;
  try { await api('/addresses/' + id, { method: 'DELETE', auth: true }); toast('已删除'); renderAddress(); }
  catch (e) { toast('删除失败：' + e.message); }
}

    <div class="layout">

            : `<div class="empty">暂无积分流水<br><small>下单并支付后，交易域发 order.paid 事件，用户域消费后发放积分</small></div>`}

            <div class="sum-row"><span>会员等级</span><span class="v">Lv.${me ? (me.level ?? 1) : '—'}</span></div>
            <div class="sum-row"><span>账户余额</span><span class="v">${me ? money(me.balance) : '—'}</span></div>
            <div style="font-size:12px;color:var(--muted);margin-top:10px">积分流水与 user_info.credits 同库同事务，且 (biz_type,biz_id,type) 唯一索引做幂等 —— 重复投递不会重复发积分。</div>
          </div>
        </div>
      </aside>
    </div>`;
}

/* ---------------- 路由 ---------------- */
function markNav(name) {
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('on', a.dataset.nav === name));
}
function route() {
  let raw = location.hash || '';
  if (raw.startsWith('#')) { raw = raw.slice(1); }
  if (raw.startsWith('/')) { raw = raw.slice(1); }
  // 支持 #/mall?type=2&cat=xx 这类带查询串的路由
  const qi = raw.indexOf('?');
  const qs = qi >= 0 ? raw.slice(qi + 1) : '';
  const path = qi >= 0 ? raw.slice(0, qi) : raw;
  const q = parseQuery(qs);
  const [name, arg] = path.split('/');
  $('#apiShow').textContent = '接口地址：' + API();
  refreshCartBadge();
  if (name === 'shop') return renderShop(arg);
  if (name === 'login') return renderLogin();
  if (name === 'me') return renderMe();
  if (name === 'nearby') return renderNearby();
  if (name === 'mall') return renderMall(q);
  if (name === 'item') return renderItem(arg, q);
  if (name === 'cart') return renderCart();
  if (name === 'checkout') return renderCheckout(q);
  if (name === 'orders') return renderOrders(q);
  if (name === 'order') return renderOrder(arg);
  if (name === 'pay') return renderPay(arg);
  if (name === 'address') return renderAddress();
  if (name === 'points') return renderPoints();
  return renderHome(arg ? decodeURIComponent(arg) : '');
}
window.addEventListener('hashchange', route);

/* ---------------- 启动 ---------------- */
$('#apiBtn').onclick = () => {
  const cur = API();
  const v = prompt('后端接口地址（网关地址，默认 ' + DEFAULT_API + '）', cur);
  if (v != null) {
    localStorage.setItem('tc_api', trimSlash(v.trim()));
    $('#apiShow').textContent = '接口地址：' + API();
    toast('已切换到 ' + API());
    route();
  }
};
(async function boot() {
  await refreshMe();
  if (!location.hash) location.hash = '#/home';
  route();
})();
</script>
