# LLMall 前端 Nginx 站点配置
# 该文件会被复制到 /etc/nginx/conf.d/default.conf（只包含 server 块）。
# 容器需与 gateway 处于同一 Docker 网络（本项目为 external network: local-life）。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 10m;

    # 容器健康检查：不依赖后端，只确认 Nginx 与静态站点已就绪
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 与 Vite dev server 相同的语义：/api/xxx -> gateway:8080/xxx
    # 末尾的 / 会去掉 location 前缀中的 /api/。
    # ^~ 保证 /api/ 下的路径不会被静态资源正则 location 抢走。
    location ^~ /api/ {
        proxy_pass http://gateway:8080/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location = /api {
        return 308 /api/;
    }

    # 带 hash 的构建产物可长缓存；缺失资源直接 404，避免回退成 index.html
    location ~* \.(?:js|css|woff2?|png|jpe?g|gif|svg|ico|webp)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # SPA history 路由回退；index.html 不缓存，保证发版后立即拿到新资源
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
