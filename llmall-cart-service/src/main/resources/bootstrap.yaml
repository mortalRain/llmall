spring:
  application:
    name: llmall-cart-service # 核心标识，Nacos、日志配置都依赖它
  profiles:
    active: local
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:192.168.189.128:8848}
      # 服务发现配置
      discovery:
        namespace: ${NACOS_NAMESPACE:public}
      # 配置中心配置
      config:
        server-addr: ${NACOS_ADDR:192.168.189.128:8848}
        file-extension: yaml
        shared-configs:
          - dataId: shared-jdbc.yaml
            refresh: true
          # MQ 连接与消费口径（prefetch / 重试次数 / default-requeue-rejected / 死信）
          # —— cart 是 order.create 的消费方，消费失败口径必须与其它服务一致，
          # 原来它只在本地 application.yaml 里手写了一小段 rabbitmq 配置，容易与 shared-mq 漂移。
          - dataId: shared-mq.yaml
            refresh: true
          - dataId: shared-log.yaml
            refresh: true
          - dataId: shared-swagger.yaml
            refresh: true
