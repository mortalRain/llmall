# 本机环境值；换环境时用环境变量覆盖
llmall:
  db:
    host: 192.168.189.128
    pw: ${LLMALL_DB_PW:123}
  # 【注意】shared-redis.yaml / shared-mq.yaml 用 ${llmall.redis.host} / ${llmall.mq.host} 拼连接，
  # 本文件缺这两个键会因占位符无法解析而启动即退出（Unable to resolve placeholder）。
  redis:
    host: 192.168.189.128
    pw: ${LLMALL_REDIS_PW:123456}   # 【注意】口令为 123456，与库口令 123 不同
  mq:
    host: 192.168.189.128
