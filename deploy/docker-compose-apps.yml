# 应用编排：11 个业务服务 + 网关，要求同一 docker 网络内已有 mysql / redis / nacos / rabbitmq。
# 【注意】每个服务限 256M（JVM 堆 192M），全量 11 个服务约 2.2G；内存不足时只用 core profile。

x-app: &app
  image: local-life/llmall:1.0.0
  restart: unless-stopped
  environment: &app-env
    TZ: Asia/Shanghai
    # 以下变量通过 Spring 的宽松绑定覆盖各服务配置里的占位符（llmall.db.host / llmall.redis.host ...）
    NACOS_ADDR: ${NACOS_ADDR:-nacos:8848}
    NACOS_NAMESPACE: ${NACOS_NAMESPACE:-public}
    LLMALL_DB_HOST: ${LLMALL_DB_HOST:-mysql}
    LLMALL_DB_PW: ${LLMALL_DB_PW:?请在 deploy/.env 中设置 LLMALL_DB_PW（示例值见 deploy/.env.example）}
    LLMALL_REDIS_HOST: ${LLMALL_REDIS_HOST:-redis}
    LLMALL_REDIS_PW: ${LLMALL_REDIS_PW:?请在 deploy/.env 中设置 LLMALL_REDIS_PW（示例值见 deploy/.env.example）}
    LLMALL_MQ_HOST: ${LLMALL_MQ_HOST:-mq}   # 【注意】MQ 容器名是 mq，不是 rabbitmq
    LLMALL_ES_HOST: ${LLMALL_ES_HOST:-elasticsearch}
    # 【注意】上述默认值对应 docker-compose-infra-lite.yml 从零起的一整套容器环境；VM 现役环境 RabbitMQ 容器叫 mq、Redis 是原生安装（要填宿主 IP），照默认值起会 UnknownHostException。
    # Sentinel 控制台：控制台跑在宿主（Windows）8090，容器经 VMnet8 网关回连宿主，需要放行 8090 入站；控制台也搬进容器后改成 sentinel-dashboard:8090。
    # 【注意】规则推送是「控制台 → 客户端 8719」的反向联接：只配了地址但控制台回不到容器时，表现为"机器列表看得到、规则推不下去"。
    LLMALL_SENTINEL_DASHBOARD: ${LLMALL_SENTINEL_DASHBOARD:-192.168.189.1:8090}
    # 服务间内部凭证：与其余凭据同口径，必须由 deploy/.env 提供（缺失即报错，不用代码里的演示默认值）。
    # 【注意】服务 yaml 里仍保留 ${LLMALL_INTERNAL_TOKEN:...} 的默认值，那是给「IDEA 裸跑读不到 .env」的开发路径用的；
    #   容器路径一律走这里注入，两者不要混。
    LLMALL_INTERNAL_TOKEN: ${LLMALL_INTERNAL_TOKEN:?请在 deploy/.env 中设置 LLMALL_INTERNAL_TOKEN}
    JAVA_OPTS: "-Xms64m -Xmx192m -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Dspring.jmx.enabled=false -Dfile.encoding=UTF-8 -Dserver.shutdown=graceful -Dspring.lifecycle.timeout-per-shutdown-phase=30s"
  networks:
    - local-life
  mem_limit: 256m
  # 停机时给在途请求与定时任务 40 秒收尾：默认只有 10 秒，JVM 被 SIGKILL 会截断正在处理的下单/核销
  stop_grace_period: 40s
  # 健康探针：容器里没有 curl，用 wget；服务端口各不相同，逐个探测已知端口，任一返回 status:UP 即视为健康（start_period 覆盖 Spring 冷启动）。
  healthcheck:
    test: ["CMD-SHELL", "for p in 8080 8081 8082 8084 8085 8086 8087 8088 8089 8093; do wget -q -O- http://127.0.0.1:$$p/actuator/health 2>/dev/null | grep -q '\"status\":\"UP\"' && exit 0; done; exit 1"]
    interval: 30s
    # 【取值依据】单次探针超时 15s，必须远小于 interval（30s），否则一次探针会跨到下一轮；
    # 探针本体是 wget + grep，正常毫秒级返回，15s 是留给冷启动 JVM 首次响应 actuator 的余量。
    timeout: 15s
    retries: 5
    start_period: 90s

services:

  gateway:
    <<: *app
    container_name: gateway
    command: [ "sh", "-c", "exec java $$JAVA_OPTS -jar /app/llmall-gateway.jar" ]
    ports:
      - "8080:8080"
    profiles: [ "core", "full" ]

  llmall-user-service:
    <<: *app
    container_name: llmall-user-service
    command: [ "sh", "-c", "exec java $$JAVA_OPTS -jar /app/llmall-user-service.jar" ]
    profiles: [ "core", "full" ]

  llmall-shop-service:
    <<: *app
    container_name: llmall-shop-service
    command: [ "sh", "-c", "exec java $$JAVA_OPTS -jar /app/llmall-shop-service.jar" ]
    profiles: [ "core", "full" ]

  llmall-item-service:
    <<: *app
    container_name: llmall-item-service
    command: [ "sh", "-c", "exec java $$JAVA_OPTS -jar /app/llmall-item-service.jar" ]
    profiles: [ "core", "full" ]

  llmall-content-service:
    <<: *app
    container_name: llmall-content-service
    command: [ "sh", "-c", "exec java $$JAVA_OPTS -jar /app/llmall-content-service.jar" ]
    profiles: [ "core", "full" ]

  llmall-trade-service:
    <<: *app
    container_name: llmall-trade-service
    command: [ "sh", "-c", "exec java $$JAVA_OPTS -jar /app/llmall-trade-service.jar" ]
    profiles: [ "full" ]

  llmall-cart-service:
    <<: *app
    container_name: llmall-cart-service
    command: [ "sh", "-c", "exec java $$JAVA_OPTS -jar /app/llmall-cart-service.jar" ]
    profiles: [ "full" ]

  llmall-pay-service:
    <<: *app
    container_name: llmall-pay-service
    command: [ "sh", "-c", "exec java $$JAVA_OPTS -jar /app/llmall-pay-service.jar" ]
    profiles: [ "full" ]

  llmall-promotion-service:
    <<: *app
    container_name: llmall-promotion-service
    command: [ "sh", "-c", "exec java $$JAVA_OPTS -jar /app/llmall-promotion-service.jar" ]
    profiles: [ "full" ]

  llmall-search-service:
    <<: *app
    container_name: llmall-search-service
    command: [ "sh", "-c", "exec java $$JAVA_OPTS -jar /app/llmall-search-service.jar" ]
    profiles: [ "full" ]

networks:
  local-life:
    external: true
    name: ${APP_NETWORK:-local-life}
