# 观测栈：Prometheus + Grafana。
# 与业务容器共用外部网络（deploy/docker-compose-apps.yml 里的 local-life），
# 按容器名抓取各服务的 /actuator/prometheus。只发布 9090 / 3000 两个端口。
#
# 启动：先确保 local-life 网络已存在（业务 compose 已创建），再执行
#   docker compose -f deploy/docker-compose-observability.yml --profile obs up -d
services:
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: llmall-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
    ports:
      - "9090:9090"
    networks:
      - local-life
    profiles: ["obs"]

  grafana:
    image: grafana/grafana:11.1.0
    container_name: llmall-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana-datasource.yml:/etc/grafana/provisioning/datasources/prom.yml:ro
      - ./observability/grafana-dashboard-provider.yml:/etc/grafana/provisioning/dashboards/provider.yml:ro
      - ./observability/grafana-dashboard.json:/etc/grafana/provisioning/dashboards/llmall-overview.json:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - local-life
    profiles: ["obs"]

networks:
  local-life:
    external: true
    name: ${APP_NETWORK:-local-life}
