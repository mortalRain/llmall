# shared-log.yaml · 集中日志与运行时口径（Nacos 共享配置，导入口径：group=DEFAULT_GROUP，dataId=shared-log.yaml，格式 YAML）。
# 【注意】各服务 bootstrap.yaml 均已声明该 dataId，未导入 Nacos 时集中日志配置静默失效，只能各服务重复写 logging.level.*。

logging:
  level:
    root: info
    # 业务代码统一 info：debug 会连带打印大量 SQL 与参数，Feign 的 FULL 日志会带出支付密码
    com.llmall: info
    # 框架噪音压到 warn，避免启动/心跳刷屏
    com.alibaba.nacos: warn
    org.springframework.amqp: warn
  pattern:
    # 带服务名 + traceId，便于多服务日志混在一起时区分来源，也便于按 traceId 捞整条链路。
    # %X{traceId:-} 里的 "-" 是默认值：没有 traceId 的线程（定时任务、启动日志）打印 "-" 而不是报错。
    console: "%d{HH:mm:ss.SSS} %-5level [${spring.application.name}] [%X{traceId:-}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [${spring.application.name}] [%X{traceId:-}] [%thread] %logger{36} - %msg%n"

# 运行时口径：所有经 Nacos 取配置的服务统一生效
server:
  shutdown: graceful          # 优雅停机：先停止接收新请求，等在途请求处理完再退出

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus   # 暴露这四类；prometheus 是 QPS/RT/连接池/JVM 指标出口；/actuator/** 不进网关白名单，仅内网直连
  endpoint:
    health:
      probes:
        enabled: true                  # 提供 /actuator/health/liveness 与 /readiness，供编排判断
      show-details: never              # 不外泄数据库/中间件连接细节
  health:
    # 【注意】必须关掉 Sentinel 健康指标：SentinelHealthIndicator 在控制台/传输客户端未就绪时会抛 ExceptionInInitializerError，导致聚合 /actuator/health 报错；关闭不影响限流/熔断本身。
    sentinel:
      enabled: false
