server:
  port: 8080
llmall:
  jwt:
    location: ${LLMALL_JKS_LOCATION:classpath:llmall.jks}
    alias: llmall
    password: ${LLMALL_JKS_PASSWORD:llmall123}
    tokenTTL: 30m      # 无感刷新时网关签发的新 access token 有效期
    refreshTTL: 7d     # 【注意】必须与 llmall-user-service 保持一致，真正校验以 Redis 白名单为准
  redis:
    host: ${LLMALL_REDIS_HOST:192.168.189.128}   # 容器化时由 LLMALL_REDIS_HOST 覆盖
    pw: ${LLMALL_REDIS_PW:123456}                # 【注意】口令为 123456，与库口令 123 不同，写错表现为启动即 Redis 连接失败
  # 服务间内部调用凭证：网关在"认证通过"后把它注入 x-internal-token 头一并转给下游。
  # 下游服务监听 0.0.0.0，只凭 user-info 头无法区分"经网关的可信请求"与"直连服务端口伪造的请求"，两者同时具备才采信身份。
  # 网关在入口处已剥离客户端自带的同名头，该值不会流到外部。
  # 【注意】所有服务（含网关自己）的 llmall.internal.token 必须一致；生产应由配置中心/密钥管理下发。
  internal:
    token: ${LLMALL_INTERNAL_TOKEN:llmall-internal-demo-token}
  auth:
    # 【唯一权威来源】鉴权白名单只在这里生效：AuthProperties(@ConfigurationProperties("llmall.auth")) 仅存在于网关模块。
    # 其它模块 yaml 里的 llmall.auth.excludePaths 没有任何读取方，写了不报错也不生效（假安全）；新增白名单请只改这里。
    # 【只读白名单】本清单只对安全方法（GET/HEAD/OPTIONS）生效，非安全方法一律走鉴权 —— 过滤器按"路径 + 方法"两个维度判断。
    # 【注意】只读路径不要写成 /**：AntPathMatcher 的 /** 匹配任意多段路径，一条 /items/**（本意是"商品详情免登录可浏览"）
    # 会连带放行 DELETE /items/{id}、PUT /items/stock/restore（无限加库存）、PUT /items（改价/上下架）；写接口永远不要出现在本清单里。
    excludePaths:
      # 搜索：检索/热词/建议/附近公开（未登录也能搜）
      - /search
      - /search/hot-words
      - /search/suggest
      - /search/nearby
      # 商品：只有列表/详情/分类/门店商品这些读接口公开
      - /items
      - /items/*
      - /items/shop/*
      - /items/categories
      - /items/page
      # 门店与门店类型（读）
      - /shops
      - /shops/*
      - /shop-types
      - /shop-types/
      # 内容域：笔记列表/详情、"门店下笔记列表"公开可读（未登录也能看评价）
      - /blogs
      - /blogs/*
      - /blogs/shop/**
      - /blogs/*/comments
      - /blogs/*/liked
      - /blogs/*/liked-users
      # 促销域：券列表是"未登录也能看有哪些券"的公开读接口；领取/秒杀/我的券需登录
      - /vouchers/list
      # 自测路径：由 llmall.debug.enabled 开关控制，默认已关闭（关闭时该路径没有对应端点即 404）
      # 【注意】仅在跑越权验收（scripts/verify-auth.ps1）时临时打开 llmall-user-service 的该开关
      - /users/_debug/**
    # 【公开写接口白名单】这些接口本身就是写方法（POST/PUT/...），无法靠"安全方法"规则自动放行，必须显式登记。
    # 【注意】只有"未登录也必须能调"的接口才配出现在这里，目前仅限认证流程本身（登录/短信登录/发验证码）。
    unsafeExcludePaths:
      - /users/login
      - /users/login/sms
      - /users/code
spring:
  cloud:
    sentinel:
      transport:
        # Sentinel 控制台地址，默认按"控制台与应用同机（宿主 8090）"取值。
        # 换环境（控制台在 VM / 云服务器上）可用启动参数 --llmall.sentinel.dashboard=ip:8090、环境变量 LLMALL_SENTINEL_DASHBOARD 或 Nacos 配置覆盖，无需改代码。
        # 【注意】控制台自身默认端口是 8080，会和网关冲突，启动时必须显式指定 8090；控制台不在线只是连接告警，不影响 @SentinelResource 定义的限流/降级生效。
        dashboard: ${llmall.sentinel.dashboard:localhost:8090}
    gateway:
      # 跨域：演示前端可能以 file:// 或其它端口打开，需要网关放行 CORS
      # 【注意】生产环境请把 allowedOriginPatterns 收紧为具体域名
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
  # 【注意】网关的 Redis 连接没有走 Nacos 的 shared-redis.yaml（网关是最外层入口，启动期就要能验 refresh 白名单与黑名单，
  # 不能让"配置中心不可用"连带影响鉴权），所以这些参数必须在这里再写一份：口径与 nacos-config/shared-redis.yaml 保持一致，
  # 改一处时另一处必须同步改。
  redis:
    host: ${llmall.redis.host}
    port: 6379
    password: ${llmall.redis.pw}
    # 【注意】Spring Data Redis 默认命令超时 60s：Redis 一旦 hang 住，网关的每一个请求都会卡满 60s 才失败，
    # 网关是所有流量的入口，被拖住等于整站不可用；鉴权只查一次黑名单（EXISTS/SISMEMBER 级调用），2s 是数量级的余量。
    connect-timeout: 2s
    timeout: 2s
    # 走哨兵：与其它服务同一口径 —— 主库挂了要让网关也能自己跟到新主库，
    # 否则"上游都切了、网关还连着死掉的主库"会表现为全站 401/超时。
    sentinel:
      master: llmall-master
      nodes: ${llmall.redis.host}:26379,${llmall.redis.host}:26380,${llmall.redis.host}:26381
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
        # 【注意】池耗尽时的等待上限。不配的话 commons-pool2 默认 -1 = 无限等待，
        # 第 11 个并发请求会永远阻塞在 borrowObject 上（它不在上面的命令超时覆盖范围内）。
        max-wait: 1s
