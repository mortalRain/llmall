server:
  port: 8088
# Seata AT：本服务是 RM（券核销的参与方）；默认关闭。
seata:
  enabled: false
  application-id: llmall-promotion-service
  tx-service-group: llmall-tx-group
  enable-auto-data-source-proxy: true
  data-source-proxy-mode: AT
  service:
    vgroup-mapping:
      llmall-tx-group: default
  registry:
    type: nacos
    nacos:
      application: seata-server
      server-addr: ${NACOS_ADDR:192.168.189.128:8848}
      group: SEATA_GROUP
      cluster: default
  config:
    type: file
feign:
  client:
    config:
      default:
        # 【取值依据】连接 2s / 读取 5s，与 item / trade / user / pay / cart 保持同一口径。
        # 【注意】必须显式配：不配时走 Feign 默认（连接 10s / 读取 60s），下游 hang 住会让调用方挂满 60s，
        # 把"下游慢"放大成"调用方线程池与连接池被占满"（而不是快速失败 + 走兜底）。
        connectTimeout: 2000
        readTimeout: 5000
  okhttp:
    enabled: true
  sentinel:
    enabled: true
spring:
  cloud:
    loadbalancer:
      retry:
        # 【2026-10-15】显式关闭负载均衡层重试。本层与 Feign 层的 Retryer 是两套独立机制：
        # Feign 层已由 NoRetryFeignConfig 钉死为 NEVER_RETRY，而本层由 spring.cloud.loadbalancer.retry 控制（当前默认关闭）。
        # 写接口一旦在这层被重试就是重复扣款/重复下单，且不会有任何编译或运行时报错 —— 显式写死 false 防回归。
        enabled: false
    sentinel:
      # eager 控制是否启动即向 Sentinel 控制台注册；false 为惰性注册，要等首次请求后控制台才看得到实例。
      # 【注意】不要改成 true：启动期即连控制台，控制台未启动时会因初始化 NPE 导致整个服务启动失败。
      eager: false
      transport:
        dashboard: ${llmall.sentinel.dashboard:localhost:8090}
      http-method-specify: true
  rabbitmq:
    listener:
      simple:
        # 秒杀落库必须手动 ack：自动 ack 在消息投递成功时即确认，落库事务执行中被打断则消息已被 broker 删除，
        # 表现为"Redis 名额已扣、用户永远拿不到券"且无迹可查；手动 ack 把确认推迟到事务提交之后，配合 consume_record 唯一键做幂等。
        acknowledge-mode: manual
        # 【取值依据】手动 ack 下 prefetch 是"已投递未确认"的上限：设为 1 表示落库事务提交并 ack 之后
        # 才取下一批，消费速率天然被 DB 落库能力限住，秒杀峰值不会把消息堆在消费者内存里。
        # 【调大后果】峰值时成批消息预取进内存，消费者重启后这批未 ack 消息重新入队，重复消费量被放大；
        # 提吞吐应调消费者的并发数，而不是预取。
        prefetch: 1
llmall:
  swagger:
    title: "同城生活电商综合服务系统 · 营销服务接口文档"
    package: com.llmall.promotion.controller
  db:
    database: llmall-promotion
  # 服务间内部调用凭证：UserInfoInterceptor 仅在该请求头与本值完全一致时才采信 user-info 头。
  # 【注意】全项目所有服务必须配成同一个值，否则表现为"请求全部未登录"；生产应由网关注入或配置中心下发。
  internal:
    token: ${LLMALL_INTERNAL_TOKEN:llmall-internal-demo-token}
    # 服务间调用凭证：本服务调用 llmall-user-service 的扣款/退款内部接口时需要携带该头。
    # 【注意】值必须与 llmall-user-service / llmall-pay-service / llmall-trade-service 一致。
    service-token: ${LLMALL_SERVICE_TOKEN:llmall-service-demo-token}

# 接口文档：knife4j 4.x（openapi3），UI 地址 /doc.html，OpenAPI JSON /v3/api-docs。
knife4j:
  enable: true
  setting:
    language: zh_cn
springdoc:
  api-docs:
    path: /v3/api-docs
  # 扫描范围：本应用全部 controller，不必按包名逐个列举。
  group-configs:
    - group: default
      paths-to-match: '/**'
      packages-to-scan: com.llmall
